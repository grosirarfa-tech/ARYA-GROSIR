<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ARYA GROSIR - POS System</title>
  
  <!-- Tailwind CSS & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Barcode Scanner Library & Chart.js + Plugin DataLabels -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>

  <style>
    body {
      background-color: #050505;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    .card-menu {
      background: #121212;
      border: 1px solid #222222;
      border-radius: 20px;
      transition: all 0.2s ease;
    }
    .card-menu:active {
      transform: scale(0.98);
      background: #1a1a1a;
      border-color: #f59e0b;
    }
    .input-dark {
      background: #0a0a0a;
      border: 1px solid #2a2a2a;
      color: #ffffff;
      border-radius: 10px;
      padding: 10px 14px;
      width: 100%;
      outline: none;
    }
    .input-dark:focus {
      border-color: #f59e0b;
    }
    .label-field {
      font-size: 0.75rem;
      color: #9ca3af;
      margin-bottom: 0.25rem;
      display: block;
      font-weight: 600;
    }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 sm:p-5">

  <!-- HEADER UTAMA -->
  <header class="flex flex-col items-center justify-center pt-2 pb-4">
    <img src="logo web arya.png" alt="Arya Grosir Logo" class="h-16 sm:h-20 object-contain mb-2 cursor-pointer" onclick="goHome()">
    <div class="flex items-center gap-3 text-xs sm:text-sm">
      <span class="text-emerald-500 font-bold flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> PREMIUM POS SYSTEM
      </span>
      <button onclick="goHome()" class="bg-amber-500/10 border border-amber-500/40 text-amber-400 px-3 py-1 rounded-full flex items-center gap-1 font-semibold hover:bg-amber-500/20">
        <i class="fa-solid fa-house text-xs"></i> HOME
      </button>
      <span id="liveClock" class="text-gray-400 font-mono">00:00:00</span>
    </div>
  </header>

  <!-- CONTAINER DINAMIS -->
  <main id="app" class="flex-1 max-w-3xl w-full mx-auto pb-6">
    <!-- UI RENDERED HERE -->
  </main>

  <!-- MODAL NOTIFIKASI & KONFIRMASI CUSTOM (PERBAIKAN POIN 1) -->
  <div id="customModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-gray-900 border border-amber-500/40 rounded-2xl p-5 max-w-sm w-full text-center space-y-4 shadow-2xl">
      <div id="modalIcon" class="text-3xl text-amber-500"><i class="fa-solid fa-circle-info"></i></div>
      <p id="modalMessage" class="text-sm font-semibold text-white"></p>
      <div id="modalButtons" class="flex gap-2 justify-center pt-2">
        <!-- Dynamic Buttons -->
      </div>
    </div>
  </div>

  <!-- MODAL FULLSCREEN SCANNER BARCODE -->
  <div id="scannerModal" class="fixed inset-0 bg-black z-50 hidden flex-col justify-between p-4">
    <div class="flex justify-between items-center z-10">
      <span class="text-white font-bold text-sm">Scan Barcode Barang</span>
      <button onclick="closeScanner()" class="bg-red-600 px-4 py-1.5 rounded-full text-xs font-bold">Tutup</button>
    </div>
    <div id="reader" class="w-full max-w-md mx-auto my-auto rounded-lg overflow-hidden border border-amber-500"></div>
    <div class="text-center pb-4">
      <button id="torchBtn" onclick="toggleTorch()" class="bg-gray-800 text-amber-400 border border-amber-500/30 px-6 py-2 rounded-full text-xs font-bold">
        <i class="fa-solid fa-flashlight"></i> Toggle Senter
      </button>
    </div>
  </div>

  <script>
    // Register ChartJS DataLabels Plugin
    Chart.register(ChartDataLabels);

    // LOCAL STORAGE STATE
    let db = {
      katalog: JSON.parse(localStorage.getItem('ag_katalog')) || [],
      belanja: JSON.parse(localStorage.getItem('ag_belanja')) || [],
      penjualan: JSON.parse(localStorage.getItem('ag_penjualan')) || [],
      pengeluaran: JSON.parse(localStorage.getItem('ag_pengeluaran')) || [],
      gasUrl: localStorage.getItem('ag_gas_url') || ''
    };

    let cartTemp = [];
    let activeTransactionId = null;
    let activeTransactionDate = null;
    let currentRoute = { view: 'MAIN', param: null };
    let html5QrCode = null;
    let torchState = false;
    let scanTargetCallback = null;

    function saveState() {
      localStorage.setItem('ag_katalog', JSON.stringify(db.katalog));
      localStorage.setItem('ag_belanja', JSON.stringify(db.belanja));
      localStorage.setItem('ag_penjualan', JSON.stringify(db.penjualan));
      localStorage.setItem('ag_pengeluaran', JSON.stringify(db.pengeluaran));
      localStorage.setItem('ag_gas_url', db.gasUrl);
    }

    setInterval(() => {
      const now = new Date();
      const clockEl = document.getElementById('liveClock');
      if (clockEl) clockEl.innerText = now.toTimeString().split(' ')[0];
    }, 1000);

    function formatNumber(num) {
      if (!num && num !== 0) return '';
      return num.toString().replace(/\D/g, "").replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    function parseNumber(str) {
      if (!str) return 0;
      return parseInt(str.toString().replace(/\./g, '')) || 0;
    }

    function formatRp(val) {
      return "Rp " + formatNumber(val || 0);
    }

    // FORMAT TANGGAL DD-MM-YYYY (PERBAIKAN POIN 2)
    function formatDateDMY(dateStr) {
      if (!dateStr) return '-';
      const cleanStr = dateStr.split('T')[0];
      const parts = cleanStr.split('-');
      if (parts.length === 3) {
        return `${parts[2]}-${parts[1]}-${parts[0]}`;
      }
      return dateStr;
    }

    // MODAL NOTIFIKASI & KONFIRMASI CUSTOM (PERBAIKAN POIN 1)
    function showNotif(msg, callback = null) {
      const modal = document.getElementById('customModal');
      document.getElementById('modalIcon').innerHTML = '<i class="fa-solid fa-circle-check text-emerald-400"></i>';
      document.getElementById('modalMessage').innerText = msg;
      const btnContainer = document.getElementById('modalButtons');
      btnContainer.innerHTML = `<button onclick="closeCustomModal()" class="bg-amber-600 hover:bg-amber-500 text-white px-6 py-2 rounded-xl text-xs font-bold">OK</button>`;
      modal._callback = callback;
      modal.classList.remove('hidden');
    }

    function showConfirm(msg, onConfirm) {
      const modal = document.getElementById('customModal');
      document.getElementById('modalIcon').innerHTML = '<i class="fa-solid fa-triangle-exclamation text-amber-500"></i>';
      document.getElementById('modalMessage').innerText = msg;
      const btnContainer = document.getElementById('modalButtons');
      btnContainer.innerHTML = `
        <button onclick="executeConfirm(true)" class="bg-red-600 hover:bg-red-500 text-white px-5 py-2 rounded-xl text-xs font-bold">Ya, Hapus</button>
        <button onclick="executeConfirm(false)" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-5 py-2 rounded-xl text-xs font-bold">Batal</button>
      `;
      modal._onConfirm = onConfirm;
      modal.classList.remove('hidden');
    }

    function closeCustomModal() {
      const modal = document.getElementById('customModal');
      modal.classList.add('hidden');
      if (modal._callback) {
        modal._callback();
        modal._callback = null;
      }
    }

    function executeConfirm(result) {
      const modal = document.getElementById('customModal');
      modal.classList.add('hidden');
      if (result && modal._onConfirm) {
        modal._onConfirm();
      }
      modal._onConfirm = null;
    }

    function navigateTo(view, param = null) {
      window.history.pushState({ view: view, param: param }, '', '');
      renderView(view, param);
    }

    function goHome() {
      navigateTo('MAIN');
    }

    window.addEventListener('popstate', function (event) {
      if (event.state && event.state.view) {
        renderView(event.state.view, event.state.param);
      } else {
        showConfirm("Keluar dari Aplikasi ARYA GROSIR?", () => {
          window.close();
        });
      }
    });

    window.addEventListener('keydown', function(e) {
      if (e.key === 'F5') {
        e.preventDefault();
        if (currentRoute.view === 'STOK_LIST') navigateTo('STOK_FORM');
        if (currentRoute.view === 'BELANJA_LIST') startNewBelanja();
        if (currentRoute.view === 'PENJUALAN_LIST') startNewPenjualan();
      }
      if (e.key === 'F7') {
        e.preventDefault();
        window.history.back();
      }
      if (e.key === 'F8') {
        e.preventDefault();
        if (currentRoute.view === 'BELANJA_FORM') checkoutBelanja();
        if (currentRoute.view === 'PENJUALAN_FORM') checkoutPenjualan();
        if (currentRoute.view === 'STOK_FORM') saveKatalogForm(currentRoute.param);
      }
    });

    function startNewBelanja() {
      cartTemp = [];
      activeTransactionId = 'BLJ-' + Date.now().toString().slice(-6);
      activeTransactionDate = new Date().toISOString().split('T')[0];
      navigateTo('BELANJA_FORM');
    }

    function startNewPenjualan() {
      cartTemp = [];
      activeTransactionId = 'PJL-' + Date.now().toString().slice(-6);
      activeTransactionDate = new Date().toISOString().split('T')[0];
      navigateTo('PENJUALAN_FORM');
    }

    // FUNGSI HAPUS TRANSAKSI & ITEM (PERBAIKAN POIN 3)
    function deleteBelanja(id) {
      showConfirm("Hapus riwayat belanja ini?", () => {
        db.belanja = db.belanja.filter(item => item.ID !== id);
        saveState();
        renderView('BELANJA_LIST');
        showNotif("Riwayat belanja berhasil dihapus!");
      });
    }

    function deletePenjualan(id) {
      showConfirm("Hapus riwayat penjualan ini?", () => {
        db.penjualan = db.penjualan.filter(item => item.ID !== id);
        saveState();
        renderView('PENJUALAN_LIST');
        showNotif("Riwayat penjualan berhasil dihapus!");
      });
    }

    function deletePengeluaran(idx) {
      showConfirm("Hapus catatan pengeluaran ini?", () => {
        db.pengeluaran.splice(idx, 1);
        saveState();
        renderView('PENGELUARAN');
        showNotif("Pengeluaran berhasil dihapus!");
      });
    }

    function deleteKatalog(idx) {
      showConfirm("Hapus barang dari katalog?", () => {
        db.katalog.splice(idx, 1);
        saveState();
        renderView('STOK_LIST');
        showNotif("Barang berhasil dihapus!");
      });
    }

    function deleteKeuntunganPerTanggal(dateStr) {
      showConfirm(`Hapus seluruh transaksi penjualan & pengeluaran pada tanggal ${formatDateDMY(dateStr)}?`, () => {
        db.penjualan = db.penjualan.filter(p => p.TANGGAL !== dateStr);
        db.pengeluaran = db.pengeluaran.filter(e => e.TANGGAL !== dateStr);
        saveState();
        renderView('KEUNTUNGAN');
        showNotif(`Data keuntungan tanggal ${formatDateDMY(dateStr)} berhasil dihapus!`);
      });
    }

    function renderView(view, param) {
      currentRoute = { view: view, param: param };
      const app = document.getElementById('app');
      app.innerHTML = '';

      if (view === 'MAIN') {
        app.innerHTML = `
          <div class="grid grid-cols-2 gap-3 sm:gap-4 mt-2">
            <div onclick="navigateTo('BELANJA_LIST')" class="card-menu p-5 flex flex-col items-center justify-center text-center cursor-pointer min-h-[120px]">
              <i class="fa-solid fa-basket-shopping text-3xl text-amber-500 mb-2"></i>
              <span class="font-bold text-xs sm:text-sm tracking-wide">BELANJA BARANG</span>
            </div>
            <div onclick="navigateTo('PENJUALAN_LIST')" class="card-menu p-5 flex flex-col items-center justify-center text-center cursor-pointer min-h-[120px]">
              <i class="fa-solid fa-cart-shopping text-3xl text-amber-500 mb-2"></i>
              <span class="font-bold text-xs sm:text-sm tracking-wide">PENJUALAN</span>
            </div>
            <div onclick="navigateTo('STOK_LIST')" class="card-menu p-5 flex flex-col items-center justify-center text-center cursor-pointer min-h-[120px]">
              <i class="fa-solid fa-boxes-stacked text-3xl text-cyan-500 mb-2"></i>
              <span class="font-bold text-xs sm:text-sm tracking-wide">STOK BARANG</span>
            </div>
            <div onclick="navigateTo('PERKIRAAN')" class="card-menu p-5 flex flex-col items-center justify-center text-center cursor-pointer min-h-[120px]">
              <i class="fa-solid fa-chart-line text-3xl text-purple-500 mb-2"></i>
              <span class="font-bold text-xs sm:text-sm tracking-wide">PERKIRAAN BELANJA</span>
            </div>
            <div onclick="navigateTo('PENGELUARAN')" class="card-menu p-5 flex flex-col items-center justify-center text-center cursor-pointer min-h-[120px]">
              <i class="fa-solid fa-receipt text-3xl text-teal-500 mb-2"></i>
              <span class="font-bold text-xs sm:text-sm tracking-wide">PENGELUARAN LAIN</span>
            </div>
            <div onclick="navigateTo('KEUNTUNGAN')" class="card-menu p-5 flex flex-col items-center justify-center text-center cursor-pointer min-h-[120px]">
              <i class="fa-solid fa-wallet text-3xl text-pink-500 mb-2"></i>
              <span class="font-bold text-xs sm:text-sm tracking-wide">KEUNTUNGAN</span>
            </div>
            <div onclick="window.open('https://docs.google.com', '_blank')" class="card-menu p-5 flex flex-col items-center justify-center text-center cursor-pointer min-h-[120px]">
              <i class="fa-solid fa-file-invoice text-3xl text-yellow-500 mb-2"></i>
              <span class="font-bold text-xs sm:text-sm tracking-wide">PENGATURAN FAKTUR</span>
            </div>
            <div onclick="navigateTo('SYNC')" class="card-menu p-5 flex flex-col items-center justify-center text-center cursor-pointer min-h-[120px]">
              <i class="fa-solid fa-rotate text-3xl text-emerald-500 mb-2"></i>
              <span class="font-bold text-xs sm:text-sm tracking-wide">SINKRONISASI</span>
            </div>
          </div>
        `;
      }

      // STOK BARANG
      else if (view === 'STOK_LIST') {
        app.innerHTML = `
          <div class="flex justify-between items-center mb-4">
            <h2 class="font-bold text-base">Katalog Stok Barang</h2>
            <button onclick="navigateTo('STOK_FORM')" class="bg-amber-600 px-3 py-1.5 rounded-xl text-xs font-bold">+ Tambah Barang (F5)</button>
          </div>
          <div class="space-y-2">
            ${db.katalog.length === 0 ? '<p class="text-gray-500 text-xs text-center py-6">Belum ada barang di katalog.</p>' : ''}
            ${db.katalog.map((item, idx) => `
              <div onclick="navigateTo('STOK_DETAIL', ${idx})" class="card-menu p-3 cursor-pointer hover:border-amber-500">
                <div class="flex justify-between items-center">
                  <span class="font-bold text-amber-400 text-sm">${item['NAMA BARANG']}</span>
                  <span class="bg-gray-800 text-white text-[10px] px-2 py-0.5 rounded-full">Stok: ${formatNumber(item['QTY'])} ${item['SATUAN'] || ''}</span>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }
      else if (view === 'STOK_FORM') {
        let isEdit = param !== null && param !== undefined;
        let item = isEdit ? db.katalog[param] : {};
        app.innerHTML = `
          <div class="card-menu p-4 space-y-3">
            <h3 class="font-bold text-amber-400 border-b border-gray-800 pb-2">${isEdit ? 'Edit Barang' : 'Tambah Barang Baru'}</h3>
            <div>
              <label class="label-field">Barcode / SKU</label>
              <div class="flex gap-2">
                <input type="text" id="kBarcode" value="${item['BARCODE'] || ''}" class="input-dark text-xs" placeholder="Scan/Ketik Barcode" onkeydown="handleNextInput(event, 'kNama')">
                <button onclick="openScanner('kBarcode')" class="bg-amber-600 px-3 rounded-lg text-xs font-bold"><i class="fa-solid fa-barcode"></i></button>
              </div>
            </div>
            <div>
              <label class="label-field">Nama Barang</label>
              <input type="text" id="kNama" value="${item['NAMA BARANG'] || ''}" class="input-dark text-xs uppercase" placeholder="Nama Barang" onkeydown="handleNextInput(event, 'kQty')">
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="label-field">Jumlah Stok (Qty)</label>
                <input type="text" id="kQty" value="${formatNumber(item['QTY'] || 0)}" class="input-dark text-xs" inputmode="numeric" oninput="formatInputNumber(this)" onkeydown="handleNextInput(event, 'kSatuan')">
              </div>
              <div>
                <label class="label-field">Satuan (Pcs, Box, Pack)</label>
                <input type="text" id="kSatuan" value="${item['SATUAN'] || 'PCS'}" class="input-dark text-xs uppercase" placeholder="PCS" onkeydown="handleNextInput(event, 'kMinQty')">
              </div>
            </div>
            <div>
              <label class="label-field">Minimal Stok Warning</label>
              <input type="text" id="kMinQty" value="${formatNumber(item['MINIMAL QTY'] || 5)}" class="input-dark text-xs" inputmode="numeric" oninput="formatInputNumber(this)" onkeydown="handleNextInput(event, 'kHargaPokok')">
            </div>
            <div>
              <label class="label-field">Harga Pokok / Modal (Rp)</label>
              <input type="text" id="kHargaPokok" value="${formatNumber(item['HARGA POKOK'] || 0)}" class="input-dark text-xs" inputmode="numeric" oninput="formatInputNumber(this)" onkeydown="handleNextInput(event, 'kHargaGrosir')">
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="label-field">Harga Jual Grosir (Rp)</label>
                <input type="text" id="kHargaGrosir" value="${formatNumber(item['HARGA JUAL GROSIR'] || 0)}" class="input-dark text-xs" inputmode="numeric" oninput="formatInputNumber(this)" onkeydown="handleNextInput(event, 'kHargaRetail')">
              </div>
              <div>
                <label class="label-field">Harga Jual Retail (Rp)</label>
                <input type="text" id="kHargaRetail" value="${formatNumber(item['HARGA JUAL RETAIL'] || 0)}" class="input-dark text-xs" inputmode="numeric" oninput="formatInputNumber(this)">
              </div>
            </div>
            <button onclick="saveKatalogForm(${isEdit ? param : 'null'})" class="w-full bg-emerald-600 py-2.5 rounded-xl text-xs font-bold mt-2">Simpan Katalog (F8)</button>
          </div>
        `;
      }
      else if (view === 'STOK_DETAIL') {
        let item = db.katalog[param];
        app.innerHTML = `
          <div class="card-menu p-4 space-y-3">
            <h3 class="font-bold text-amber-400 border-b border-gray-800 pb-2">Detail Barang</h3>
            <div class="grid grid-cols-2 gap-2 text-xs">
              <span class="text-gray-400">Barcode:</span> <span class="font-bold">${item['BARCODE'] || '-'}</span>
              <span class="text-gray-400">Nama Barang:</span> <span class="font-bold">${item['NAMA BARANG']}</span>
              <span class="text-gray-400">Qty Stok:</span> <span class="font-bold">${formatNumber(item['QTY'])} ${item['SATUAN']}</span>
              <span class="text-gray-400">Minimal Stok:</span> <span class="font-bold">${formatNumber(item['MINIMAL QTY'])}</span>
              <span class="text-gray-400">Harga Pokok:</span> <span class="font-bold">${formatRp(item['HARGA POKOK'])}</span>
              <span class="text-gray-400">Harga Grosir:</span> <span class="font-bold">${formatRp(item['HARGA JUAL GROSIR'])}</span>
              <span class="text-gray-400">Harga Retail:</span> <span class="font-bold">${formatRp(item['HARGA JUAL RETAIL'])}</span>
            </div>
            <div class="flex gap-2 pt-3">
              <button onclick="navigateTo('STOK_FORM', ${param})" class="flex-1 bg-amber-600 py-2 rounded-xl text-xs font-bold">Edit Barang</button>
              <button onclick="deleteKatalog(${param})" class="flex-1 bg-red-600 py-2 rounded-xl text-xs font-bold">Hapus</button>
            </div>
          </div>
        `;
      }

      // RIWAYAT & FORM BELANJA
      else if (view === 'BELANJA_LIST') {
        let sortedBelanja = [...db.belanja].sort((a, b) => new Date(b.TANGGAL) - new Date(a.TANGGAL));
        app.innerHTML = `
          <div class="flex justify-between items-center mb-4">
            <h2 class="font-bold text-base">Riwayat Belanja Barang</h2>
            <button onclick="startNewBelanja()" class="bg-amber-600 px-3 py-1.5 rounded-xl text-xs font-bold">+ Transaksi Baru (F5)</button>
          </div>
          <div class="space-y-2">
            ${sortedBelanja.length === 0 ? '<p class="text-gray-500 text-xs text-center py-6">Belum ada riwayat belanja.</p>' : ''}
            ${sortedBelanja.map((b) => `
              <div class="card-menu p-3 hover:border-amber-500 flex justify-between items-center text-xs">
                <div onclick="navigateTo('BELANJA_DETAIL', '${b.ID}')" class="flex-1 grid grid-cols-3 items-center cursor-pointer">
                  <span class="text-gray-300 font-mono">${formatDateDMY(b.TANGGAL)}</span>
                  <span class="text-amber-400 font-bold text-center">${b.ID}</span>
                  <span class="text-emerald-400 font-bold text-right">${formatRp(b.TOTAL_HARGA || b['TOTAL HARGA'])}</span>
                </div>
                <button onclick="deleteBelanja('${b.ID}')" class="ml-3 text-red-500 hover:text-red-400 p-1"><i class="fa-solid fa-trash"></i></button>
              </div>
            `).join('')}
          </div>
        `;
      }
      else if (view === 'BELANJA_FORM') {
        let totalBelanja = cartTemp.reduce((sum, item) => sum + (item.harga * item.qty), 0);
        app.innerHTML = `
          <div class="space-y-4">
            <div class="card-menu p-4 space-y-3">
              <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                <span class="text-xs font-bold text-amber-400">ID: ${activeTransactionId}</span>
                <input type="date" id="bljTanggal" value="${activeTransactionDate}" onchange="activeTransactionDate=this.value" class="bg-gray-800 text-white text-xs px-2 py-1 rounded">
              </div>
              <div class="flex gap-2">
                <input type="text" id="bljSearch" placeholder="Cari nama / scan barcode barang..." class="input-dark text-xs" oninput="renderSearchKatalog(this.value, 'BELANJA')">
                <button onclick="openScannerForCart('BELANJA')" class="bg-amber-600 px-3 rounded-lg text-xs font-bold"><i class="fa-solid fa-barcode"></i></button>
              </div>
              <div id="searchResult" class="space-y-1 max-h-40 overflow-y-auto"></div>
            </div>

            <!-- TABEL KERANJANG BELANJA -->
            <div class="card-menu p-4 space-y-3">

    // KERANJANG HELPER FUNCTIONS
    function renderSearchKatalog(query, type) {
      const resultDiv = document.getElementById('searchResult');
      if(!query.trim()) {
        resultDiv.innerHTML = '';
        return;
      }
      let matches = db.katalog.filter(k => 
        (k['NAMA BARANG'] && k['NAMA BARANG'].toLowerCase().includes(query.toLowerCase())) ||
        (k['BARCODE'] && k['BARCODE'].toLowerCase().includes(query.toLowerCase()))
      );

      resultDiv.innerHTML = matches.map(k => `
        <div onclick="addToCart('${k['NAMA BARANG']}', '${type}')" class="bg-gray-800 hover:bg-amber-600 p-2 rounded-lg cursor-pointer text-xs flex justify-between items-center">
          <span class="font-bold">${k['NAMA BARANG']}</span>
          <span class="text-[10px] text-gray-300">Stok: ${formatNumber(k['QTY'])}</span>
        </div>
      `).join('');
    }

    function addToCart(namaBarang, type) {
      let item = db.katalog.find(k => k['NAMA BARANG'] === namaBarang);
      if(!item) return;

      let existing = cartTemp.find(c => c.nama === namaBarang);
      if(existing) {
        existing.qty += 1;
      } else {
        if(type === 'BELANJA') {
          cartTemp.push({
            nama: item['NAMA BARANG'],
            qty: 1,
            harga: parseNumber(item['HARGA POKOK'])
          });
        } else {
          cartTemp.push({
            nama: item['NAMA BARANG'],
            qty: 1,
            hargaRetail: parseNumber(item['HARGA JUAL RETAIL']),
            hargaGrosir: parseNumber(item['HARGA JUAL GROSIR']),
            tipeHarga: 'retail',
            harga: parseNumber(item['HARGA JUAL RETAIL'])
          });
        }
      }

      document.getElementById('searchResult').innerHTML = '';
      if(type === 'BELANJA') {
        const inputSearch = document.getElementById('bljSearch');
        if(inputSearch) inputSearch.value = '';
        renderView('BELANJA_FORM');
      } else {
        const inputSearch = document.getElementById('pjlSearch');
        if(inputSearch) inputSearch.value = '';
        renderView('PENJUALAN_FORM');
      }
    }

    function updateCartQty(idx, val, currentView) {
      cartTemp[idx].qty = parseNumber(val);
      renderView(currentView);
    }

    function updateCartHarga(idx, val, currentView) {
      cartTemp[idx].harga = parseNumber(val);
      renderView(currentView);
    }

    function updateCartTypeHarga(idx, type) {
      cartTemp[idx].tipeHarga = type;
      cartTemp[idx].harga = type === 'grosir' ? cartTemp[idx].hargaGrosir : cartTemp[idx].hargaRetail;
      renderView('PENJUALAN_FORM');
    }

    function removeFromCart(idx, currentView) {
      cartTemp.splice(idx, 1);
      renderView(currentView);
    }

    function checkoutBelanja() {
      if(cartTemp.length === 0) return showNotif("Keranjang belanja kosong!");
      let total = cartTemp.reduce((sum, item) => sum + (item.harga * item.qty), 0);

      // Tambah / Update Stok di Katalog
      cartTemp.forEach(cItem => {
        let kat = db.katalog.find(k => k['NAMA BARANG'] === cItem.nama);
        if(kat) {
          kat['QTY'] = parseNumber(kat['QTY']) + cItem.qty;
          kat['HARGA POKOK'] = cItem.harga;
        } else {
          db.katalog.push({
            'BARCODE': '',
            'NAMA BARANG': cItem.nama,
            'QTY': cItem.qty,
            'SATUAN': 'PCS',
            'MINIMAL QTY': 5,
            'HARGA POKOK': cItem.harga,
            'HARGA JUAL GROSIR': cItem.harga,
            'HARGA JUAL RETAIL': cItem.harga
          });
        }
      });

      db.belanja.push({
        ID: activeTransactionId,
        TANGGAL: activeTransactionDate,
        ITEMS: cartTemp,
        TOTAL_HARGA: total
      });

      saveState();
      showNotif("Transaksi Belanja Berhasil Disimpan!", () => {
        navigateTo('BELANJA_LIST');
      });
    }

    function checkoutPenjualan() {
      if(cartTemp.length === 0) return showNotif("Keranjang penjualan kosong!");
      let total = cartTemp.reduce((sum, item) => sum + (item.harga * item.qty), 0);
      let pembeli = document.getElementById('pjlPembeli') ? document.getElementById('pjlPembeli').value.trim() : 'Umum';

      // Kurangi Stok Katalog
      cartTemp.forEach(cItem => {
        let kat = db.katalog.find(k => k['NAMA BARANG'] === cItem.nama);
        if(kat) {
          kat['QTY'] = Math.max(0, parseNumber(kat['QTY']) - cItem.qty);
        }
      });

      db.penjualan.push({
        ID: activeTransactionId,
        TANGGAL: activeTransactionDate,
        'NAMA PEMBELI': pembeli || 'Umum',
        ITEMS: cartTemp,
        TOTAL_HARGA: total
      });

      saveState();
      showNotif("Transaksi Penjualan Berhasil Disimpan!", () => {
        navigateTo('PENJUALAN_LIST');
      });
    }

    // PENGELUARAN & FORM HANDLERS
    function savePengeluaran() {
      let tanggal = document.getElementById('expTanggal').value;
      let ket = document.getElementById('expKet').value.trim();
      let nominal = parseNumber(document.getElementById('expNominal').value);

      if(!ket || nominal <= 0) {
        return showNotif("Isi keterangan dan nominal pengeluaran dengan benar!");
      }

      db.pengeluaran.push({ TANGGAL: tanggal, KETERANGAN: ket, NOMINAL: nominal });
      saveState();
      renderView('PENGELUARAN');
      showNotif("Pengeluaran berhasil disimpan!");
    }

    function formatInputNumber(el) {
      let val = parseNumber(el.value);
      el.value = formatNumber(val);
    }

    function handleNextInput(e, nextId) {
      if (e.key === 'Enter') {
        e.preventDefault();
        const nextEl = document.getElementById(nextId);
        if (nextEl) nextEl.focus();
      }
    }

    function saveKatalogForm(paramIdx) {
      let barcode = document.getElementById('kBarcode').value.trim();
      let nama = document.getElementById('kNama').value.trim();
      let qty = parseNumber(document.getElementById('kQty').value);
      let satuan = document.getElementById('kSatuan').value.trim();
      let minQty = parseNumber(document.getElementById('kMinQty').value);
      let hgPokok = parseNumber(document.getElementById('kHargaPokok').value);
      let hgGrosir = parseNumber(document.getElementById('kHargaGrosir').value);
      let hgRetail = parseNumber(document.getElementById('kHargaRetail').value);

      if(!nama) return showNotif("Nama barang wajib diisi!");

      let itemData = {
        'BARCODE': barcode,
        'NAMA BARANG': nama,
        'QTY': qty,
        'SATUAN': satuan || 'PCS',
        'MINIMAL QTY': minQty,
        'HARGA POKOK': hgPokok,
        'HARGA JUAL GROSIR': hgGrosir,
        'HARGA JUAL RETAIL': hgRetail
      };

      if(paramIdx !== null && paramIdx !== undefined) {
        db.katalog[paramIdx] = itemData;
      } else {
        db.katalog.push(itemData);
      }

      saveState();
      showNotif("Data barang berhasil disimpan!", () => {
        navigateTo('STOK_LIST');
      });
    }

    // SYNC HANDLERS
    function saveGasUrl() {
      db.gasUrl = document.getElementById('gasUrlInput').value.trim();
      saveState();
      showNotif("URL Google Apps Script disimpan!");
    }

    function syncUpload() {
      if(!db.gasUrl) return showNotif("Isi URL GAS terlebih dahulu!");
      fetch(db.gasUrl, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'upload', data: db })
      }).then(() => {
        showNotif("Proses Upload selesai dikirim ke Spreadsheet!");
      }).catch(err => {
        showNotif("Gagal melakukan upload data: " + err);
      });
    }

    function syncDownload() {
      if(!db.gasUrl) return showNotif("Isi URL GAS terlebih dahulu!");
      fetch(db.gasUrl + '?action=download')
        .then(res => res.json())
        .then(data => {
          if(data) {
            if(data.katalog) db.katalog = data.katalog;
            if(data.belanja) db.belanja = data.belanja;
            if(data.penjualan) db.penjualan = data.penjualan;
            if(data.pengeluaran) db.pengeluaran = data.pengeluaran;
            saveState();
            showNotif("Data berhasil didownload dari Spreadsheet!", () => {
              renderView('MAIN');
            });
          }
        }).catch(err => {
          showNotif("Gagal download data dari Spreadsheet: " + err);
        });
    }

    // SCANNER BARCODE HANDLERS
    function openScanner(targetInputId) {
      scanTargetCallback = (code) => {
        const input = document.getElementById(targetInputId);
        if(input) input.value = code;
      };
      startScannerModal();
    }

    function openScannerForCart(type) {
      scanTargetCallback = (code) => {
        let kat = db.katalog.find(k => k['BARCODE'] === code);
        if(kat) {
          addToCart(kat['NAMA BARANG'], type);
        } else {
          showNotif("Barang dengan barcode " + code + " tidak ditemukan!");
        }
      };
      startScannerModal();
    }

    function startScannerModal() {
      document.getElementById('scannerModal').classList.remove('hidden');
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 150 } },
        (decodedText) => {
          if(scanTargetCallback) scanTargetCallback(decodedText);
          closeScanner();
        },
        () => {}
      ).catch(err => {
        showNotif("Gagal membuka kamera: " + err);
        closeScanner();
      });
    }

    function closeScanner() {
      if(html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          document.getElementById('scannerModal').classList.add('hidden');
        }).catch(() => {
          document.getElementById('scannerModal').classList.add('hidden');
        });
      } else {
        document.getElementById('scannerModal').classList.add('hidden');
      }
    }

    function toggleTorch() {
      if(html5QrCode) {
        torchState = !torchState;
        html5QrCode.applyVideoConstraints({
          advanced: [{ torch: torchState }]
        }).catch(() => {});
      }
    }

    // INITIAL LOAD
    renderView('MAIN');
  </script>
</body>
</html>
