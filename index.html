<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ARYA GROSIR - POS System</title>
  
  <!-- Tailwind CSS & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Barcode Scanner Library, Chart.js & Chart.js DataLabels Plugin -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>

  <style>
    body {
      background-color: #050505;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    .card-menu {
      background: #121212;
      border: 1px solid #222222;
      border-radius: 20px;
      transition: all 0.2s ease;
    }
    .card-menu:active {
      transform: scale(0.98);
      background: #1a1a1a;
      border-color: #f59e0b;
    }
    .input-dark {
      background: #0a0a0a;
      border: 1px solid #2a2a2a;
      color: #ffffff;
      border-radius: 10px;
      padding: 10px 14px;
      width: 100%;
      outline: none;
    }
    .input-dark:focus {
      border-color: #f59e0b;
    }
    .label-field {
      font-size: 0.75rem;
      color: #9ca3af;
      margin-bottom: 0.25rem;
      display: block;
      font-weight: 600;
    }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 sm:p-5">

  <!-- HEADER UTAMA -->
  <header class="flex flex-col items-center justify-center pt-2 pb-4">
    <img src="logo web arya.png" alt="Arya Grosir Logo" class="h-16 sm:h-20 object-contain mb-2 cursor-pointer" onclick="goHome()">
    <div class="flex items-center gap-3 text-xs sm:text-sm">
      <span class="text-emerald-500 font-bold flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> PREMIUM POS SYSTEM
      </span>
      <button onclick="goHome()" class="bg-amber-500/10 border border-amber-500/40 text-amber-400 px-3 py-1 rounded-full flex items-center gap-1 font-semibold hover:bg-amber-500/20">
        <i class="fa-solid fa-house text-xs"></i> HOME
      </button>
      <span id="liveClock" class="text-gray-400 font-mono">00:00:00</span>
    </div>
  </header>

  <!-- CONTAINER DINAMIS -->
  <main id="app" class="flex-1 max-w-3xl w-full mx-auto pb-6">
    <!-- UI RENDERED HERE -->
  </main>

  <!-- MODAL FULLSCREEN SCANNER BARCODE -->
  <div id="scannerModal" class="fixed inset-0 bg-black z-50 hidden flex-col justify-between p-4">
    <div class="flex justify-between items-center z-10">
      <span class="text-white font-bold text-sm">Scan Barcode Barang</span>
      <button onclick="closeScanner()" class="bg-red-600 px-4 py-1.5 rounded-full text-xs font-bold">Tutup</button>
    </div>
    <div id="reader" class="w-full max-w-md mx-auto my-auto rounded-lg overflow-hidden border border-amber-500"></div>
    <div class="text-center pb-4">
      <button id="torchBtn" onclick="toggleTorch()" class="bg-gray-800 text-amber-400 border border-amber-500/30 px-6 py-2 rounded-full text-xs font-bold">
        <i class="fa-solid fa-flashlight"></i> Toggle Senter
      </button>
    </div>
  </div>

  <script>
    // LOCAL STORAGE STATE
    let db = {
      katalog: JSON.parse(localStorage.getItem('ag_katalog')) || [],
      belanja: JSON.parse(localStorage.getItem('ag_belanja')) || [],
      penjualan: JSON.parse(localStorage.getItem('ag_penjualan')) || [],
      pengeluaran: JSON.parse(localStorage.getItem('ag_pengeluaran')) || [],
      gasUrl: localStorage.getItem('ag_gas_url') || ''
    };

    let cartTemp = [];
    let activeTransactionId = null;
    let activeTransactionDate = null;
    let currentRoute = { view: 'MAIN', param: null };
    let html5QrCode = null;
    let torchState = false;
    let scanTargetCallback = null;

    function saveState() {
      localStorage.setItem('ag_katalog', JSON.stringify(db.katalog));
      localStorage.setItem('ag_belanja', JSON.stringify(db.belanja));
      localStorage.setItem('ag_penjualan', JSON.stringify(db.penjualan));
      localStorage.setItem('ag_pengeluaran', JSON.stringify(db.pengeluaran));
      localStorage.setItem('ag_gas_url', db.gasUrl);
    }

    setInterval(() => {
      const now = new Date();
      const clockEl = document.getElementById('liveClock');
      if (clockEl) clockEl.innerText = now.toTimeString().split(' ')[0];
    }, 1000);

    // PERBAIKAN 1: Custom Notification Modal menggantikan alert browser
    function showNotif(msg, callback = null) {
      const modal = document.createElement('div');
      modal.className = "fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4 animate-fade-in";
      modal.innerHTML = `
        <div class="bg-[#121212] border border-amber-500/40 rounded-2xl p-5 max-w-xs w-full text-center space-y-4 shadow-2xl">
          <p class="text-white text-sm font-semibold">${msg}</p>
          <button id="notifOkBtn" class="w-full py-2 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl text-xs transition">OK</button>
        </div>
      `;
      document.body.appendChild(modal);
      document.getElementById('notifOkBtn').onclick = () => {
        modal.remove();
        if (callback) callback();
      };
    }

    function customConfirm(msg, onConfirm) {
      const modal = document.createElement('div');
      modal.className = "fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4 animate-fade-in";
      modal.innerHTML = `
        <div class="bg-[#121212] border border-red-500/40 rounded-2xl p-5 max-w-xs w-full text-center space-y-4 shadow-2xl">
          <p class="text-white text-sm font-semibold">${msg}</p>
          <div class="flex gap-2">
            <button id="confirmYes" class="flex-1 py-2 bg-red-600 hover:bg-red-500 text-white font-bold rounded-xl text-xs transition">Ya, Hapus</button>
            <button id="confirmNo" class="flex-1 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold rounded-xl text-xs transition">Batal</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
      document.getElementById('confirmYes').onclick = () => { modal.remove(); onConfirm(); };
      document.getElementById('confirmNo').onclick = () => { modal.remove(); };
    }

    // PERBAIKAN 2: Format Tanggal ke dd-mm-yyyy
    function formatDateDMY(dateString) {
      if (!dateString) return '-';
      const d = new Date(dateString);
      if (isNaN(d.getTime())) return dateString;
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const year = d.getFullYear();
      return `${day}-${month}-${year}`;
    }

    function formatNumber(num) {
      if (!num && num !== 0) return '';
      return num.toString().replace(/\D/g, "").replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    function parseNumber(str) {
      if (!str) return 0;
      return parseInt(str.toString().replace(/\./g, '')) || 0;
    }

    function formatRp(val) {
      return "Rp " + formatNumber(val || 0);
    }

    function formatInputNumber(el) {
      let val = parseNumber(el.value);
      el.value = val ? formatNumber(val) : '';
    }

    function navigateTo(view, param = null) {
      window.history.pushState({ view: view, param: param }, '', '');
      renderView(view, param);
    }

    function goHome() {
      navigateTo('MAIN');
    }

    window.addEventListener('popstate', function (event) {
      if (event.state && event.state.view) {
        renderView(event.state.view, event.state.param);
      } else {
        customConfirm("Keluar dari Aplikasi ARYA GROSIR?", () => { window.close(); });
      }
    });

    window.addEventListener('keydown', function(e) {
      if (e.key === 'F5') {
        e.preventDefault();
        if (currentRoute.view === 'STOK_LIST') navigateTo('STOK_FORM');
        if (currentRoute.view === 'BELANJA_LIST') startNewBelanja();
        if (currentRoute.view === 'PENJUALAN_LIST') startNewPenjualan();
      }
      if (e.key === 'F7') {
        e.preventDefault();
        window.history.back();
      }
      if (e.key === 'F8') {
        e.preventDefault();
        if (currentRoute.view === 'BELANJA_FORM') checkoutBelanja();
        if (currentRoute.view === 'PENJUALAN_FORM') checkoutPenjualan();
        if (currentRoute.view === 'STOK_FORM') saveKatalogForm(currentRoute.param);
      }
    });

    function startNewBelanja() {
      cartTemp = [];
      activeTransactionId = 'BLJ-' + Date.now().toString().slice(-6);
      activeTransactionDate = new Date().toISOString().split('T')[0];
      navigateTo('BELANJA_FORM');
    }

    function startNewPenjualan() {
      cartTemp = [];
      activeTransactionId = 'PJL-' + Date.now().toString().slice(-6);
      activeTransactionDate = new Date().toISOString().split('T')[0];
      navigateTo('PENJUALAN_FORM');
    }

    // PERBAIKAN 3: Fungsi Hapus Data Riwayat & Pengeluaran
    function deleteBelanja(id) {
      customConfirm("Hapus riwayat belanja ini?", () => {
        db.belanja = db.belanja.filter(item => item.ID !== id);
        saveState();
        renderView('BELANJA_LIST');
      });
    }

    function deletePenjualan(id) {
      customConfirm("Hapus riwayat penjualan ini?", () => {
        db.penjualan = db.penjualan.filter(item => item.ID !== id);
        saveState();
        renderView('PENJUALAN_LIST');
      });
    }

    function deletePengeluaran(index) {
      customConfirm("Hapus data pengeluaran ini?", () => {
        db.pengeluaran.splice(index, 1);
        saveState();
        renderView('PENGELUARAN');
      });
    }

    function deleteKatalog(index) {
      customConfirm("Hapus barang dari katalog?", () => {
        db.katalog.splice(index, 1);
        saveState();
        renderView('STOK_LIST');
      });
    }

    function saveKatalogForm(paramIdx) {
      let nama = document.getElementById('kNama').value.trim().toUpperCase();
      if(!nama) return showNotif("Nama barang tidak boleh kosong!");
      
      let itemData = {
        'BARCODE': document.getElementById('kBarcode').value.trim(),
        'NAMA BARANG': nama,
        'QTY': parseNumber(document.getElementById('kQty').value),
        'SATUAN': document.getElementById('kSatuan').value.trim().toUpperCase(),
        'MINIMAL QTY': parseNumber(document.getElementById('kMinQty').value),
        'HARGA POKOK': parseNumber(document.getElementById('kHargaPokok').value),
        'HARGA JUAL GROSIR': parseNumber(document.getElementById('kHargaGrosir').value),
        'HARGA JUAL RETAIL': parseNumber(document.getElementById('kHargaRetail').value)
      };

      if(paramIdx !== null && paramIdx !== undefined) {
        db.katalog[paramIdx] = itemData;
      } else {
        db.katalog.push(itemData);
      }
      saveState();
      showNotif("Data barang berhasil disimpan!", () => { navigateTo('STOK_LIST'); });
    }

    function renderView(view, param) {
      currentRoute = { view: view, param: param };
      const app = document.getElementById('app');
      app.innerHTML = '';

      if (view === 'MAIN') {
        app.innerHTML = `
          <div class="grid grid-cols-2 gap-3 sm:gap-4 mt-2">
            <div onclick="navigateTo('BELANJA_LIST')" class="card-menu p-5 flex flex-col items-center justify-center text-center cursor-pointer min-h-[120px]">
              <i class="fa-solid fa-basket-shopping text-3xl text-amber-500 mb-2"></i>
              <span class="font-bold text-xs sm:text-sm tracking-wide">BELANJA BARANG</span>
            </div>
            <div onclick="navigateTo('PENJUALAN_LIST')" class="card-menu p-5 flex flex-col items-center justify-center text-center cursor-pointer min-h-[120px]">
              <i class="fa-solid fa-cart-shopping text-3xl text-amber-500 mb-2"></i>
              <span class="font-bold text-xs sm:text-sm tracking-wide">PENJUALAN</span>
            </div>
            <div onclick="navigateTo('STOK_LIST')" class="card-menu p-5 flex flex-col items-center justify-center text-center cursor-pointer min-h-[120px]">
              <i class="fa-solid fa-boxes-stacked text-3xl text-cyan-500 mb-2"></i>
              <span class="font-bold text-xs sm:text-sm tracking-wide">STOK BARANG</span>
            </div>
            <div onclick="navigateTo('PERKIRAAN')" class="card-menu p-5 flex flex-col items-center justify-center text-center cursor-pointer min-h-[120px]">
              <i class="fa-solid fa-chart-line text-3xl text-purple-500 mb-2"></i>
              <span class="font-bold text-xs sm:text-sm tracking-wide">PERKIRAAN BELANJA</span>
            </div>
            <div onclick="navigateTo('PENGELUARAN')" class="card-menu p-5 flex flex-col items-center justify-center text-center cursor-pointer min-h-[120px]">
              <i class="fa-solid fa-receipt text-3xl text-teal-500 mb-2"></i>
              <span class="font-bold text-xs sm:text-sm tracking-wide">PENGELUARAN LAIN</span>
            </div>
            <div onclick="navigateTo('KEUNTUNGAN')" class="card-menu p-5 flex flex-col items-center justify-center text-center cursor-pointer min-h-[120px]">
              <i class="fa-solid fa-wallet text-3xl text-pink-500 mb-2"></i>
              <span class="font-bold text-xs sm:text-sm tracking-wide">KEUNTUNGAN</span>
            </div>
            <div onclick="window.open('https://docs.google.com', '_blank')" class="card-menu p-5 flex flex-col items-center justify-center text-center cursor-pointer min-h-[120px]">
              <i class="fa-solid fa-file-invoice text-3xl text-yellow-500 mb-2"></i>
              <span class="font-bold text-xs sm:text-sm tracking-wide">PENGATURAN FAKTUR</span>
            </div>
            <div onclick="navigateTo('SYNC')" class="card-menu p-5 flex flex-col items-center justify-center text-center cursor-pointer min-h-[120px]">
              <i class="fa-solid fa-rotate text-3xl text-emerald-500 mb-2"></i>
              <span class="font-bold text-xs sm:text-sm tracking-wide">SINKRONISASI</span>
            </div>
          </div>
        `;
      }

      // STOK BARANG
      else if (view === 'STOK_LIST') {
        app.innerHTML = `
          <div class="flex justify-between items-center mb-4">
            <h2 class="font-bold text-base">Katalog Stok Barang</h2>
            <button onclick="navigateTo('STOK_FORM')" class="bg-amber-600 px-3 py-1.5 rounded-xl text-xs font-bold">+ Tambah Barang (F5)</button>
          </div>
          <div class="space-y-2">
            ${db.katalog.length === 0 ? '<p class="text-gray-500 text-xs text-center py-6">Belum ada barang di katalog.</p>' : ''}
            ${db.katalog.map((item, idx) => `
              <div onclick="navigateTo('STOK_DETAIL', ${idx})" class="card-menu p-3 cursor-pointer hover:border-amber-500">
                <div class="flex justify-between items-center">
                  <span class="font-bold text-amber-400 text-sm">${item['NAMA BARANG']}</span>
                  <span class="bg-gray-800 text-white text-[10px] px-2 py-0.5 rounded-full">Stok: ${formatNumber(item['QTY'])} ${item['SATUAN'] || ''}</span>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }
      else if (view === 'STOK_DETAIL') {
        let item = db.katalog[param];
        app.innerHTML = `
          <div class="card-menu p-4 space-y-3">
            <h3 class="font-bold text-amber-400 border-b border-gray-800 pb-2">Detail Barang</h3>
            <div class="grid grid-cols-2 gap-2 text-xs">
              <span class="text-gray-400">Barcode:</span> <span class="font-bold">${item['BARCODE'] || '-'}</span>
              <span class="text-gray-400">Nama Barang:</span> <span class="font-bold">${item['NAMA BARANG']}</span>
              <span class="text-gray-400">Qty Stok:</span> <span class="font-bold">${formatNumber(item['QTY'])} ${item['SATUAN']}</span>
              <span class="text-gray-400">Minimal Stok:</span> <span class="font-bold">${formatNumber(item['MINIMAL QTY'])}</span>
              <span class="text-gray-400">Harga Pokok:</span> <span class="font-bold">${formatRp(item['HARGA POKOK'])}</span>
              <span class="text-gray-400">Harga Grosir:</span> <span class="font-bold">${formatRp(item['HARGA JUAL GROSIR'])}</span>
              <span class="text-gray-400">Harga Retail:</span> <span class="font-bold">${formatRp(item['HARGA JUAL RETAIL'])}</span>
            </div>
            <div class="flex gap-2 pt-3">
              <button onclick="navigateTo('STOK_FORM', ${param})" class="flex-1 bg-amber-600 py-2 rounded-xl text-xs font-bold">Edit Barang</button>
              <button onclick="deleteKatalog(${param})" class="flex-1 bg-red-600 py-2 rounded-xl text-xs font-bold">Hapus</button>
            </div>
          </div>
        `;
      }
      else if (view === 'STOK_FORM') {
        let item = param !== null ? db.katalog[param] : {};
        app.innerHTML = `
          <div class="card-menu p-4 space-y-3">
            <h3 class="font-bold border-b border-gray-800 pb-2">${param !== null ? 'Edit Barang' : 'Tambah Barang Baru'}</h3>
            
            <div>
              <label class="label-field">Barcode Scanner</label>
              <div class="flex gap-2">
                <input type="text" id="kBarcode" value="${item['BARCODE'] || ''}" class="input-dark text-xs">
                <button onclick="openScanner((code)=>{ document.getElementById('kBarcode').value=code; })" class="bg-amber-600 px-3 rounded-lg text-xs font-bold"><i class="fa-solid fa-camera"></i></button>
              </div>
            </div>

            <div>
              <label class="label-field">Nama Barang</label>
              <input type="text" id="kNama" value="${item['NAMA BARANG'] || ''}" class="input-dark text-xs uppercase">
            </div>

            <div>
              <label class="label-field">Qty</label>
              <input type="text" id="kQty" value="${formatNumber(item['QTY'])}" class="input-dark text-xs" inputmode="numeric" oninput="formatInputNumber(this)">
            </div>

            <div>
              <label class="label-field">Satuan (PCS/PACK/KG)</label>
              <input type="text" id="kSatuan" value="${item['SATUAN'] || ''}" class="input-dark text-xs uppercase">
            </div>

            <div>
              <label class="label-field">Minimal Stok</label>
              <input type="text" id="kMinQty" value="${formatNumber(item['MINIMAL QTY'])}" class="input-dark text-xs" inputmode="numeric" oninput="formatInputNumber(this)">
            </div>

            <div>
              <label class="label-field">Harga Pokok</label>
              <input type="text" id="kHargaPokok" value="${formatNumber(item['HARGA POKOK'])}" class="input-dark text-xs" inputmode="numeric" oninput="formatInputNumber(this)">
            </div>

            <div>
              <label class="label-field">Harga Jual Grosir</label>
              <input type="text" id="kHargaGrosir" value="${formatNumber(item['HARGA JUAL GROSIR'])}" class="input-dark text-xs" inputmode="numeric" oninput="formatInputNumber(this)">
            </div>

            <div>
              <label class="label-field">Harga Jual Retail</label>
              <input type="text" id="kHargaRetail" value="${formatNumber(item['HARGA JUAL RETAIL'])}" class="input-dark text-xs" inputmode="numeric" oninput="formatInputNumber(this)">
            </div>

            <div class="flex gap-2 pt-2">
              <button onclick="saveKatalogForm(${param})" class="flex-1 bg-amber-600 py-2.5 rounded-xl text-xs font-bold">Simpan (F8)</button>
              <button onclick="window.history.back()" class="flex-1 bg-gray-800 py-2.5 rounded-xl text-xs font-bold">Batal/Cancel</button>
            </div>
          </div>
        `;
      }

      // PERBAIKAN 2 & 3: RIWAYAT BELANJA BARANG (Format Tanggal dd-mm-yyyy & Tombol Delete)
      else if (view === 'BELANJA_LIST') {
        let sortedBelanja = [...db.belanja].sort((a, b) => new Date(b.TANGGAL) - new Date(a.TANGGAL));
        app.innerHTML = `
          <div class="flex justify-between items-center mb-4">
            <h2 class="font-bold text-base">Riwayat Belanja Barang</h2>
            <button onclick="startNewBelanja()" class="bg-amber-600 px-3 py-1.5 rounded-xl text-xs font-bold">+ Transaksi Baru (F5)</button>
          </div>
          <div class="space-y-2">
            ${sortedBelanja.length === 0 ? '<p class="text-gray-500 text-xs text-center py-6">Belum ada riwayat belanja.</p>' : ''}
            ${sortedBelanja.map((b) => `
              <div class="card-menu p-3 flex justify-between items-center text-xs hover:border-amber-500 transition">
                <div onclick="navigateTo('BELANJA_DETAIL', '${b.ID}')" class="flex-1 flex items-center justify-between cursor-pointer pr-3">
                  <span class="text-gray-300 font-mono w-24">${formatDateDMY(b.TANGGAL)}</span>
                  <span class="text-amber-400 font-bold flex-1 text-center">${b.ID}</span>
                  <span class="text-emerald-400 font-bold w-28 text-right">${formatRp(b.TOTAL_HARGA || b['TOTAL HARGA'])}</span>
                </div>
                <button onclick="deleteBelanja('${b.ID}')" class="text-red-500 hover:text-red-400 px-2 py-1 rounded border border-red-500/20 bg-red-500/10">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>
            `).join('')}
          </div>
        `;
      }
      else if (view === 'BELANJA_DETAIL') {
        let b = db.belanja.find(item => item.ID === param);
        if(!b) return navigateTo('BELANJA_LIST');
        app.innerHTML = `
          <div class="card-menu p-4 space-y-3">
            <div class="flex justify-between items-center border-b border-gray-800 pb-2">
              <h3 class="font-bold text-xs text-amber-400">Keranjang Belanja - ${b.ID} (${formatDateDMY(b.TANGGAL)})</h3>
            </div>
            <div class="space-y-2 max-h-60 overflow-y-auto">
              ${(b.ITEMS || []).map((item, idx) => `
                <div class="flex justify-between items-center text-xs bg-black/40 p-2.5 rounded-lg border border-gray-800">
                  <div>
                    <div class="font-bold text-white">${item.nama}</div>
                    <div class="text-gray-400">Qty: ${formatNumber(item.qty)} ${item.satuan}</div>
                  </div>
                  <span class="font-bold text-amber-400">${formatRp(item.total)}</span>
                </div>
              `).join('')}
            </div>
            <div class="border-t border-gray-800 pt-2 flex justify-between text-xs font-bold">
              <span>Total Belanja:</span>
              <span class="text-emerald-400">${formatRp(b.TOTAL_HARGA || b['TOTAL HARGA'])}</span>
            </div>
            <button onclick="navigateTo('BELANJA_LIST')" class="w-full bg-gray-800 py-2 rounded-xl text-xs font-bold">Kembali</button>
          </div>
        `;
      }
      else if (view === 'BELANJA_FORM') {
        app.innerHTML = `
          <div class="space-y-3">
            <div class="card-menu p-4 space-y-2">

    // PERBAIKAN 4: Render Chart dengan Keuntungan Bersih per Bulan diatas tiap Batang Diagram
    function renderGrafikKeuntunganBulanan() {
      const canvas = document.getElementById('chartKeuntunganBulanan');
      if(!canvas) return;
      const ctx = canvas.getContext('2d');
      
      const labelsBulan = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      const dataKeuntungan = Array(12).fill(0);

      // Hitung Penjualan (Omset - Modal)
      db.penjualan.forEach(p => {
        let d = new Date(p.TANGGAL);
        if(!isNaN(d.getTime())) {
          let month = d.getMonth();
          let totalPenjualan = p.TOTAL_HARGA || p['TOTAL HARGA'] || 0;
          let modal = (p.ITEMS || []).reduce((acc, it) => acc + ((it.hargaPokok || 0) * it.qty), 0);
          dataKeuntungan[month] += (totalPenjualan - modal);
        }
      });

      // Kurangi Pengeluaran Lain
      db.pengeluaran.forEach(e => {
        let d = new Date(e.tanggal);
        if(!isNaN(d.getTime())) {
          let month = d.getMonth();
          dataKeuntungan[month] -= (e.jumlah || 0);
        }
      });

      if (window.myKeuntunganChart) {
        window.myKeuntunganChart.destroy();
      }

      window.myKeuntunganChart = new Chart(ctx, {
        type: 'bar',
        plugins: [ChartDataLabels],
        data: {
          labels: labelsBulan,
          datasets: [{
            label: 'Keuntungan Bersih',
            data: dataKeuntungan,
            backgroundColor: '#ec4899',
            borderRadius: 6,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: {
            padding: { top: 25 }
          },
          plugins: {
            legend: { display: false },
            datalabels: {
              anchor: 'end',
              align: 'top',
              color: '#f472b6',
              font: { weight: 'bold', size: 9 },
              formatter: function(value) {
                if (value === 0) return '0';
                return formatRp(value);
              }
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              grid: { color: '#1f2937' },
              ticks: { color: '#9ca3af', font: { size: 10 } }
            },
            x: {
              grid: { display: false },
              ticks: { color: '#9ca3af', font: { size: 10 } }
            }
          }
        }
      });
    }

    // LOGIKA PENJUALAN & BELANJA (Dipertahankan Utuh)
    function autoCompleteBelanja(query) {
      const suggest = document.getElementById('bSuggest');
      if(!query.trim()) { suggest.classList.add('hidden'); return; }
      let matches = db.katalog.filter(i => i['NAMA BARANG'].toLowerCase().includes(query.toLowerCase()));
      if(matches.length === 0) { suggest.classList.add('hidden'); return; }
      
      suggest.innerHTML = matches.map(m => `
        <div onclick="selectSuggestBelanja('${m['NAMA BARANG']}')" class="p-2 hover:bg-gray-800 cursor-pointer text-xs border-b border-gray-800">
          <div class="font-bold text-amber-400">${m['NAMA BARANG']}</div>
          <div class="text-[10px] text-gray-400">Harga Pokok: ${formatRp(m['HARGA POKOK'])}</div>
        </div>
      `).join('');
      suggest.classList.remove('hidden');
    }

    function selectSuggestBelanja(nama) {
      let item = db.katalog.find(i => i['NAMA BARANG'] === nama);
      if(item) {
        document.getElementById('bNama').value = item['NAMA BARANG'];
        document.getElementById('bSatuan').value = item['SATUAN'];
        document.getElementById('bBarcode').value = item['BARCODE'] || '';
        document.getElementById('bSuggest').classList.add('hidden');
        document.getElementById('bQty').focus();
      }
    }

    function calcBelanjaTotalAuto() {
      let nama = document.getElementById('bNama').value.trim().toUpperCase();
      let qty = parseNumber(document.getElementById('bQty').value);
      let item = db.katalog.find(i => i['NAMA BARANG'] === nama);
      if(item) {
        document.getElementById('bTotal').value = formatRp(qty * item['HARGA POKOK']);
      }
    }

    function addToCartBelanja() {
      let nama = document.getElementById('bNama').value.trim().toUpperCase();
      let qty = parseNumber(document.getElementById('bQty').value);
      if(!nama || qty <= 0) return showNotif("Nama barang dan Qty wajib diisi!");
      
      let item = db.katalog.find(i => i['NAMA BARANG'] === nama);
      let hargaPokok = item ? item['HARGA POKOK'] : 0;
      let total = qty * hargaPokok;

      cartTemp.push({
        nama: nama,
        qty: qty,
        satuan: item ? item['SATUAN'] : 'PCS',
        hargaPokok: hargaPokok,
        total: total
      });

      renderView('BELANJA_FORM');
    }

    function checkoutBelanja() {
      if(cartTemp.length === 0) return showNotif("Keranjang belanja masih kosong!");
      
      let totalHarga = cartTemp.reduce((acc, i) => acc + i.total, 0);
      let dataBelanja = {
        ID: activeTransactionId,
        TANGGAL: activeTransactionDate,
        TOTAL_HARGA: totalHarga,
        ITEMS: cartTemp
      };

      // Tambahkan stok ke katalog
      cartTemp.forEach(cartItem => {
        let item = db.katalog.find(k => k['NAMA BARANG'] === cartItem.nama);
        if(item) {
          item['QTY'] += cartItem.qty;
        }
      });

      db.belanja.push(dataBelanja);
      saveState();
      cartTemp = [];
      showNotif("Transaksi belanja berhasil disimpan & stok diperbarui!", () => { navigateTo('BELANJA_LIST'); });
    }

    function autoCompletePenjualan(query) {
      const suggest = document.getElementById('pSuggest');
      if(!query.trim()) { suggest.classList.add('hidden'); return; }
      let matches = db.katalog.filter(i => i['NAMA BARANG'].toLowerCase().includes(query.toLowerCase()));
      if(matches.length === 0) { suggest.classList.add('hidden'); return; }
      
      suggest.innerHTML = matches.map(m => `
        <div onclick="selectSuggestPenjualan('${m['NAMA BARANG']}')" class="p-2 hover:bg-gray-800 cursor-pointer text-xs border-b border-gray-800">
          <div class="font-bold text-amber-400">${m['NAMA BARANG']}</div>
          <div class="text-[10px] text-gray-400">Stok: ${m['QTY']} ${m['SATUAN']} | Retail: ${formatRp(m['HARGA JUAL RETAIL'])}</div>
        </div>
      `).join('');
      suggest.classList.remove('hidden');
    }

    function selectSuggestPenjualan(nama) {
      let item = db.katalog.find(i => i['NAMA BARANG'] === nama);
      if(item) {
        document.getElementById('pNama').value = item['NAMA BARANG'];
        document.getElementById('pSatuan').value = item['SATUAN'];
        document.getElementById('pBarcode').value = item['BARCODE'] || '';
        document.getElementById('pSuggest').classList.add('hidden');
        document.getElementById('pQty').focus();
        calcPenjualanTotalAuto();
      }
    }

    function calcPenjualanTotalAuto() {
      let nama = document.getElementById('pNama').value.trim().toUpperCase();
      let qty = parseNumber(document.getElementById('pQty').value);
      let type = document.getElementById('pType').value;
      let item = db.katalog.find(i => i['NAMA BARANG'] === nama);
      if(item) {
        let harga = type === 'GROSIR' ? item['HARGA JUAL GROSIR'] : item['HARGA JUAL RETAIL'];
        document.getElementById('pTotalItem').value = formatRp(qty * harga);
      }
    }

    function addToCartPenjualan() {
      let nama = document.getElementById('pNama').value.trim().toUpperCase();
      let qty = parseNumber(document.getElementById('pQty').value);
      let type = document.getElementById('pType').value;

      if(!nama || qty <= 0) return showNotif("Nama barang dan Qty wajib diisi!");
      
      let item = db.katalog.find(i => i['NAMA BARANG'] === nama);
      if(!item) return showNotif("Barang tidak ditemukan di katalog!");
      if(item['QTY'] < qty) return showNotif("Stok barang tidak mencukupi!");

      let hargaJual = type === 'GROSIR' ? item['HARGA JUAL GROSIR'] : item['HARGA JUAL RETAIL'];
      let total = qty * hargaJual;

      cartTemp.push({
        nama: nama,
        qty: qty,
        satuan: item['SATUAN'],
        hargaPokok: item['HARGA POKOK'],
        hargaJual: hargaJual,
        total: total
      });

      renderView('PENJUALAN_FORM');
    }

    function checkoutPenjualan() {
      if(cartTemp.length === 0) return showNotif("Keranjang penjualan masih kosong!");
      
      let totalHarga = cartTemp.reduce((acc, i) => acc + i.total, 0);
      let pembeli = document.getElementById('pPembeli').value.trim() || 'Umum';

      let dataPenjualan = {
        ID: activeTransactionId,
        TANGGAL: activeTransactionDate,
        'NAMA PEMBELI': pembeli,
        TOTAL_HARGA: totalHarga,
        ITEMS: cartTemp
      };

      // Potong stok
      cartTemp.forEach(cartItem => {
        let item = db.katalog.find(k => k['NAMA BARANG'] === cartItem.nama);
        if(item) {
          item['QTY'] -= cartItem.qty;
        }
      });

      db.penjualan.push(dataPenjualan);
      saveState();
      cartTemp = [];
      showNotif("Transaksi penjualan berhasil! Stok telah dipotong.", () => { navigateTo('PENJUALAN_LIST'); });
    }

    function savePengeluaran() {
      let ket = document.getElementById('expKet').value.trim().toUpperCase();
      let biaya = parseNumber(document.getElementById('expBiaya').value);
      let tgl = document.getElementById('expTanggal').value;

      if(!ket || biaya <= 0) return showNotif("Keterangan dan Jumlah biaya wajib diisi!");

      db.pengeluaran.push({
        tanggal: tgl,
        keterangan: ket,
        jumlah: biaya
      });

      saveState();
      showNotif("Pengeluaran berhasil dicatat!", () => { renderView('PENGELUARAN'); });
    }

    function saveGasUrl() {
      let url = document.getElementById('gasUrlInput').value.trim();
      db.gasUrl = url;
      saveState();
      showNotif("URL Google Apps Script berhasil disimpan!");
    }

    function syncDataData() {
      if(!db.gasUrl) return showNotif("Harap isi URL Google Apps Script terlebih dahulu!");
      showNotif("Proses sinkronisasi data sedang berjalan...");
    }

    // SCANNER CAMERA LOGIC
    function openScanner(callback) {
      scanTargetCallback = callback;
      document.getElementById('scannerModal').classList.remove('hidden');
      document.getElementById('scannerModal').classList.add('flex');

      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 150 } },
        (decodedText) => {
          if (scanTargetCallback) scanTargetCallback(decodedText);
          closeScanner();
        },
        () => {}
      ).catch(() => {
        showNotif("Gagal membuka kamera.");
        closeScanner();
      });
    }

    function closeScanner() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          document.getElementById('scannerModal').classList.add('hidden');
          document.getElementById('scannerModal').classList.remove('flex');
        }).catch(() => {
          document.getElementById('scannerModal').classList.add('hidden');
          document.getElementById('scannerModal').classList.remove('flex');
        });
      } else {
        document.getElementById('scannerModal').classList.add('hidden');
        document.getElementById('scannerModal').classList.remove('flex');
      }
    }

    function toggleTorch() {
      if (html5QrCode) {
        torchState = !torchState;
        html5QrCode.applyVideoConstraints({
          advanced: [{ torch: torchState }]
        }).catch(() => {});
      }
    }

    function onScanBelanja(code) {
      document.getElementById('bBarcode').value = code;
      let item = db.katalog.find(i => i['BARCODE'] === code);
      if(item) {
        document.getElementById('bNama').value = item['NAMA BARANG'];
        document.getElementById('bSatuan').value = item['SATUAN'];
        document.getElementById('bQty').focus();
      }
    }

    function onScanPenjualan(code) {
      document.getElementById('pBarcode').value = code;
      let item = db.katalog.find(i => i['BARCODE'] === code);
      if(item) {
        document.getElementById('pNama').value = item['NAMA BARANG'];
        document.getElementById('pSatuan').value = item['SATUAN'];
        document.getElementById('pQty').focus();
        calcPenjualanTotalAuto();
      }
    }

    // INIT APP
    renderView('MAIN');
  </script>
</body>
</html>
