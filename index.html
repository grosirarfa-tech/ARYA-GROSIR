<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ARYA GROSIR - POS System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@html5-qrcode/core"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #050505; color: #ffffff; font-family: sans-serif; }
    .card-dark { background: #121212; border: 1px solid #222; border-radius: 18px; }
    .btn-action { background: #1a1a1a; border: 1px solid #333; transition: all 0.2s; }
    .btn-action:active { transform: scale(0.96); background: #2a2a2a; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4">

  <!-- HEADER -->
  <header class="flex flex-col items-center justify-center mb-6">
    <img src="logo web arya.png" alt="Arya Grosir" class="h-16 mb-2 object-contain" onclick="navTo('MAIN')">
    <div class="flex items-center gap-4 text-xs text-gray-400">
      <span class="text-green-500 font-bold">● PREMIUM POS SYSTEM</span>
      <button onclick="navTo('MAIN')" class="bg-amber-600/30 border border-amber-500 text-amber-400 px-3 py-1 rounded-full flex items-center gap-1">
        <i class="fa-solid fa-house"></i> HOME
      </button>
      <span id="clockDisplay">--:--:--</span>
    </div>
  </header>

  <!-- CONTAINER MAIN VIEW -->
  <main id="appContainer" class="flex-1 max-w-4xl w-full mx-auto">
    <!-- UI DYNAMICALLY RENDERED HERE -->
  </main>

  <script>
    // LOCAL STORAGE STATE MANAGEMENT
    let db = {
      katalog: JSON.parse(localStorage.getItem('ag_katalog')) || [],
      belanja: JSON.parse(localStorage.getItem('ag_belanja')) || [],
      penjualan: JSON.parse(localStorage.getItem('ag_penjualan')) || [],
      pengeluaran: JSON.parse(localStorage.getItem('ag_pengeluaran')) || [],
      gasUrl: localStorage.getItem('ag_gas_url') || ''
    };

    let historyStack = ['MAIN'];
    let currentCart = [];

    function saveLocal() {
      localStorage.setItem('ag_katalog', JSON.stringify(db.katalog));
      localStorage.setItem('ag_belanja', JSON.stringify(db.belanja));
      localStorage.setItem('ag_penjualan', JSON.stringify(db.penjualan));
      localStorage.setItem('ag_pengeluaran', JSON.stringify(db.pengeluaran));
      localStorage.setItem('ag_gas_url', db.gasUrl);
    }

    // FORMAT CURRENCY
    function formatRupiah(val) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(val || 0);
    }

    // NAVIGATION SYSTEM & HARDWARE BACK BUTTON LOGIC
    function navTo(screen) {
      if (historyStack[historyStack.length - 1] !== screen) {
        historyStack.push(screen);
        window.history.pushState({ view: screen }, '');
      }
      renderView(screen);
    }

    window.addEventListener('popstate', (e) => {
      if (historyStack.length > 1) {
        historyStack.pop();
        renderView(historyStack[historyStack.length - 1]);
      } else {
        if (confirm("Keluar dari Aplikasi ARYA GROSIR?")) {
          window.close();
        } else {
          window.history.pushState({ view: 'MAIN' }, '');
        }
      }
    });

    // PHYSICAL KEYBOARD SHORTCUTS (F5 & F8 & F7)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'F5') {
        e.preventDefault();
        let current = historyStack[historyStack.length - 1];
        if (current === 'STOK') navTo('FORM_STOK');
        if (current === 'BELANJA') navTo('FORM_BELANJA');
        if (current === 'PENJUALAN') navTo('FORM_PENJUALAN');
      }
      if (e.key === 'F8') {
        e.preventDefault();
        let current = historyStack[historyStack.length - 1];
        if (current === 'FORM_BELANJA') checkoutBelanja();
        if (current === 'FORM_PENJUALAN') checkoutPenjualan();
      }
      if (e.key === 'F7') {
        e.preventDefault();
        window.history.back();
      }
    });

    // VIEW RENDERER
    function renderView(view) {
      const container = document.getElementById('appContainer');
      container.innerHTML = '';

      if (view === 'MAIN') {
        container.innerHTML = `
          <div class="grid grid-cols-2 gap-4">
            <div onclick="navTo('BELANJA')" class="card-dark p-6 flex flex-col items-center justify-center text-center cursor-pointer hover:border-amber-500">
              <i class="fa-solid fa-basket-shopping text-3xl text-amber-500 mb-3"></i>
              <span class="font-bold text-sm">BELANJA BARANG</span>
            </div>
            <div onclick="navTo('PENJUALAN')" class="card-dark p-6 flex flex-col items-center justify-center text-center cursor-pointer hover:border-amber-500">
              <i class="fa-solid fa-cart-shopping text-3xl text-amber-500 mb-3"></i>
              <span class="font-bold text-sm">PENJUALAN</span>
            </div>
            <div onclick="navTo('STOK')" class="card-dark p-6 flex flex-col items-center justify-center text-center cursor-pointer hover:border-amber-500">
              <i class="fa-solid fa-boxes-stacked text-3xl text-cyan-500 mb-3"></i>
              <span class="font-bold text-sm">STOK BARANG</span>
            </div>
            <div onclick="navTo('PERKIRAAN')" class="card-dark p-6 flex flex-col items-center justify-center text-center cursor-pointer hover:border-amber-500">
              <i class="fa-solid fa-chart-line text-3xl text-purple-500 mb-3"></i>
              <span class="font-bold text-sm">PERKIRAAN BELANJA</span>
            </div>
            <div onclick="navTo('PENGELUARAN')" class="card-dark p-6 flex flex-col items-center justify-center text-center cursor-pointer hover:border-amber-500">
              <i class="fa-solid fa-receipt text-3xl text-teal-500 mb-3"></i>
              <span class="font-bold text-sm">PENGELUARAN LAIN</span>
            </div>
            <div onclick="navTo('KEUNTUNGAN')" class="card-dark p-6 flex flex-col items-center justify-center text-center cursor-pointer hover:border-amber-500">
              <i class="fa-solid fa-wallet text-3xl text-pink-500 mb-3"></i>
              <span class="font-bold text-sm">KEUNTUNGAN</span>
            </div>
            <div onclick="window.open('https://docs.google.com', '_blank')" class="card-dark p-6 flex flex-col items-center justify-center text-center cursor-pointer hover:border-amber-500">
              <i class="fa-solid fa-file-invoice text-3xl text-yellow-500 mb-3"></i>
              <span class="font-bold text-sm">PENGATURAN FAKTUR</span>
            </div>
            <div onclick="navTo('SYNC')" class="card-dark p-6 flex flex-col items-center justify-center text-center cursor-pointer hover:border-amber-500">
              <i class="fa-solid fa-rotate text-3xl text-emerald-500 mb-3"></i>
              <span class="font-bold text-sm">SINKRONISASI</span>
            </div>
          </div>
        `;
      } else if (view === 'STOK') {
        container.innerHTML = `
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-bold">Katalog Stok</h2>
            <button onclick="navTo('FORM_STOK')" class="bg-amber-600 px-4 py-2 rounded-xl text-xs font-bold">+ Tambah (F5)</button>
          </div>
          <div class="space-y-2">
            ${db.katalog.map((item, idx) => `
              <div class="card-dark p-3 flex justify-between items-center">
                <div>
                  <div class="font-bold text-sm">${item['NAMA BARANG']}</div>
                  <div class="text-xs text-gray-400">Qty: ${item['QTY']} ${item['SATUAN']} (Min: ${item['MINIMAL QTY']})</div>
                </div>
                <div class="text-right">
                  <div class="text-xs text-amber-400 font-bold">${formatRupiah(item['HARGA JUAL RETAIL'])}</div>
                  <button onclick="deleteKatalog(${idx})" class="text-red-500 text-xs mt-1"><i class="fa-solid fa-trash"></i></button>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (view === 'FORM_STOK') {
        container.innerHTML = `
          <div class="card-dark p-4 space-y-3">
            <h3 class="font-bold border-b border-gray-800 pb-2">Form Tambah/Edit Stok</h3>
            <input type="text" id="stokBarcode" placeholder="Barcode" class="w-full bg-black border border-gray-800 p-2 rounded text-sm uppercase">
            <input type="text" id="stokNama" placeholder="Nama Barang" class="w-full bg-black border border-gray-800 p-2 rounded text-sm uppercase">
            <input type="number" id="stokQty" placeholder="Qty" class="w-full bg-black border border-gray-800 p-2 rounded text-sm">
            <input type="text" id="stokSatuan" placeholder="Satuan (PCS/KG)" class="w-full bg-black border border-gray-800 p-2 rounded text-sm uppercase">
            <input type="number" id="stokMinQty" placeholder="Minimal Qty" class="w-full bg-black border border-gray-800 p-2 rounded text-sm">
            <input type="number" id="stokHargaPokok" placeholder="Harga Pokok" class="w-full bg-black border border-gray-800 p-2 rounded text-sm">
            <input type="number" id="stokHargaGrosir" placeholder="Harga Jual Grosir" class="w-full bg-black border border-gray-800 p-2 rounded text-sm">
            <input type="number" id="stokHargaRetail" placeholder="Harga Jual Retail" class="w-full bg-black border border-gray-800 p-2 rounded text-sm">
            <button onclick="saveStok()" class="w-full bg-amber-600 py-2 rounded font-bold text-sm">Simpan</button>
          </div>
        `;
      } else if (view === 'SYNC') {
        container.innerHTML = `
          <div class="card-dark p-4 space-y-4">
            <h3 class="font-bold border-b border-gray-800 pb-2">Sinkronisasi Google Sheets</h3>
            <div>
              <label class="text-xs text-gray-400">Google Apps Script Web App URL:</label>
              <input type="text" id="gasUrlInput" value="${db.gasUrl}" class="w-full bg-black border border-gray-800 p-2 rounded text-xs mt-1">
            </div>
            <button onclick="saveGasUrl()" class="w-full bg-blue-600 py-2 rounded text-xs font-bold">Simpan URL</button>
            <div class="flex gap-2">
              <button onclick="syncPush()" class="flex-1 bg-green-600 py-2 rounded text-xs font-bold"><i class="fa-solid fa-cloud-arrow-up"></i> Kirim Data</button>
              <button onclick="syncPull()" class="flex-1 bg-amber-600 py-2 rounded text-xs font-bold"><i class="fa-solid fa-cloud-arrow-down"></i> Tarik Data</button>
            </div>
          </div>
        `;
      }
    }

    function saveStok() {
      db.katalog.push({
        'BARCODE': document.getElementById('stokBarcode').value,
        'NAMA BARANG': document.getElementById('stokNama').value.toUpperCase(),
        'QTY': Number(document.getElementById('stokQty').value),
        'SATUAN': document.getElementById('stokSatuan').value.toUpperCase(),
        'MINIMAL QTY': Number(document.getElementById('stokMinQty').value),
        'HARGA POKOK': Number(document.getElementById('stokHargaPokok').value),
        'HARGA JUAL GROSIR': Number(document.getElementById('stokHargaGrosir').value),
        'HARGA JUAL RETAIL': Number(document.getElementById('stokHargaRetail').value)
      });
      saveLocal();
      navTo('STOK');
    }

    function deleteKatalog(idx) {
      if (confirm('Hapus barang ini?')) {
        db.katalog.splice(idx, 1);
        saveLocal();
        renderView('STOK');
      }
    }

    function saveGasUrl() {
      db.gasUrl = document.getElementById('gasUrlInput').value;
      saveLocal();
      alert('URL Tersimpan!');
    }

    async function syncPush() {
      if (!db.gasUrl) return alert('Masukkan Web App URL terlebih dahulu.');
      try {
        await fetch(db.gasUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'push', payload: db })
        });
        alert('Data berhasil dikirim ke Spreadsheet!');
      } catch (e) {
        alert('Gagal mengirim data: ' + e);
      }
    }

    async function syncPull() {
      if (!db.gasUrl) return alert('Masukkan Web App URL terlebih dahulu.');
      try {
        let res = await fetch(db.gasUrl + '?action=pull');
        let data = await res.json();
        db.katalog = data.katalog || [];
        db.belanja = data.belanja || [];
        db.penjualan = data.penjualan || [];
        db.pengeluaran = data.pengeluaran || [];
        saveLocal();
        alert('Data berhasil ditarik!');
        renderView('MAIN');
      } catch (e) {
        alert('Gagal menarik data: ' + e);
      }
    }

    // CLOCK TICKER
    setInterval(() => {
      document.getElementById('clockDisplay').innerText = new Date().toLocaleTimeString('id-ID');
    }, 1000);

    // INITIAL RENDER
    renderView('MAIN');
  </script>
</body>
</html>
