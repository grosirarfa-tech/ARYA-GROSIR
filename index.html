<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Kasir POS</title>
    <!-- Tailwind CSS untuk Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            body * { visibility: hidden; }
            #area-cetak, #area-cetak * { visibility: visible; }
            #area-cetak { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <!-- Header / Navbar -->
    <header class="bg-blue-600 text-white p-4 shadow-lg no-print">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">🏪 Sistem Kasir POS (GitHub Hosting)</h1>
            <span class="text-sm bg-blue-700 px-3 py-1 rounded-full">Status: Online</span>
        </div>
    </header>

    <div class="container mx-auto p-4 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- KOLOM 1: Daftar Produk (Master Data & Stok) -->
        <div class="md:col-span-2 space-y-6 no-print">
            
            <!-- Form Tambah Produk -->
            <div class="bg-white p-4 rounded-lg shadow">
                <h2 class="text-lg font-semibold mb-3">➕ Tambah / Kelola Stok Produk</h2>
                <form id="form-produk" class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                    <input type="text" id="nama-produk" placeholder="Nama Barang" class="border p-2 rounded" required>
                    <input type="number" id="harga-produk" placeholder="Harga (Rp)" class="border p-2 rounded" required>
                    <input type="number" id="stok-produk" placeholder="Stok Awal" class="border p-2 rounded" required>
                    <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-bold p-2 rounded transition">Simpan</button>
                </form>
            </div>

            <!-- Katalog Produk -->
            <div class="bg-white p-4 rounded-lg shadow">
                <h2 class="text-lg font-semibold mb-3">📦 Daftar Stok Barang</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-200 border-b">
                                <th class="p-2">Produk</th>
                                <th class="p-2">Harga</th>
                                <th class="p-2">Sisa Stok</th>
                                <th class="p-2 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabel-produk">
                            <!-- Data produk dimasukkan lewat JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

        <!-- KOLOM 2: Keranjang & Faktur Pembayaran -->
        <div class="bg-white p-4 rounded-lg shadow flex flex-col justify-between h-fit">
            <div>
                <h2 class="text-lg font-semibold mb-3 border-b pb-2">🛒 Keranjang Belanja</h2>
                
                <!-- List Item Keranjang -->
                <div id="keranjang-list" class="space-y-3 mb-4 max-h-60 overflow-y-auto">
                    <p class="text-gray-400 text-sm text-center py-4">Belum ada barang di keranjang.</p>
                </div>

                <hr class="my-3">

                <!-- Ringkasan Total -->
                <div class="space-y-2 text-sm">
                    <div class="flex justify-between font-bold text-lg">
                        <span>Total:</span>
                        <span id="total-harga">Rp 0</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <label for="bayar" class="font-medium">Bayar (Rp):</label>
                        <input type="number" id="bayar" class="border p-1 rounded w-32 text-right" placeholder="0" oninput="hitungKembalian()">
                    </div>
                    <div class="flex justify-between font-semibold text-gray-700">
                        <span>Kembalian:</span>
                        <span id="kembalian">Rp 0</span>
                    </div>
                </div>
            </div>

            <!-- Tombol Transaksi -->
            <div class="mt-6 space-y-2 no-print">
                <button onclick="prosesTransaksi()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded shadow transition">
                    Selesaikan & Potong Stok
                </button>
                <button onclick="cetakFaktur()" class="w-full bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 rounded shadow transition">
                    🖨️ Cetak Faktur / Struk
                </button>
            </div>
        </div>

    </div>

    <!-- AREA STRUK / FAKTUR (Tersembunyi, Tampil Saat Dicetak) -->
    <div id="area-cetak" class="hidden p-6 max-w-sm mx-auto border bg-white">
        <div class="text-center mb-4">
            <h2 class="text-xl font-bold">NOTA PENJUALAN</h2>
            <p class="text-xs text-gray-500" id="faktur-tanggal"></p>
        </div>
        <hr class="border-dashed my-2">
        <div id="faktur-item" class="text-sm space-y-1">
            <!-- Item faktur -->
        </div>
        <hr class="border-dashed my-2">
        <div class="text-sm space-y-1">
            <div class="flex justify-between font-bold">
                <span>Total:</span>
                <span id="faktur-total"></span>
            </div>
            <div class="flex justify-between">
                <span>Bayar:</span>
                <span id="faktur-bayar"></span>
            </div>
            <div class="flex justify-between">
                <span>Kembalian:</span>
                <span id="faktur-kembalian"></span>
            </div>
        </div>
        <div class="text-center mt-6 text-xs text-gray-500">
            --- Terima Kasih ---
        </div>
    </div>

    <!-- SCRIPT LOGIKA POS -->
    <script>
        // Database sementara (LocalStorage browser)
        let produkList = JSON.parse(localStorage.getItem('pos_produk')) || [
            { id: 1, nama: 'Kopi Hitam', harga: 10000, stok: 20 },
            { id: 2, nama: 'Roti Bakar', harga: 15000, stok: 15 }
        ];
        let keranjang = [];

        function simpanData() {
            localStorage.setItem('pos_produk', JSON.stringify(produkList));
            renderProduk();
        }

        // Render Produk ke Tabel
        function renderProduk() {
            const tbody = document.getElementById('tabel-produk');
            tbody.innerHTML = '';
            produkList.forEach(p => {
                tbody.innerHTML += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-2">${p.nama}</td>
                        <td class="p-2">Rp ${p.harga.toLocaleString()}</td>
                        <td class="p-2">${p.stok}</td>
                        <td class="p-2 text-center">
                            <button onclick="tambahKeKeranjang(${p.id})" 
                                class="bg-blue-500 text-white px-2 py-1 rounded text-xs hover:bg-blue-600 ${p.stok <= 0 ? 'opacity-50 cursor-not-allowed' : ''}"
                                ${p.stok <= 0 ? 'disabled' : ''}>
                                + Tambah
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        // Tambah Produk Baru
        document.getElementById('form-produk').addEventListener('submit', function(e) {
            e.preventDefault();
            const nama = document.getElementById('nama-produk').value;
            const harga = parseInt(document.getElementById('harga-produk').value);
            const stok = parseInt(document.getElementById('stok-produk').value);

            produkList.push({ id: Date.now(), nama, harga, stok });
            simpanData();
            this.reset();
        });

        // Keranjang
        function tambahKeKeranjang(id) {
            const produk = produkList.find(p => p.id === id);
            const itemKeranjang = keranjang.find(k => k.id === id);

            if (itemKeranjang) {
                if (itemKeranjang.qty < produk.stok) {
                    itemKeranjang.qty++;
                } else {
                    alert('Stok barang tidak mencukupi!');
                }
            } else {
                keranjang.push({ ...produk, qty: 1 });
            }
            renderKeranjang();
        }

        function renderKeranjang() {
            const container = document.getElementById('keranjang-list');
            if (keranjang.length === 0) {
                container.innerHTML = `<p class="text-gray-400 text-sm text-center py-4">Belum ada barang di keranjang.</p>`;
            } else {
                container.innerHTML = '';
                keranjang.forEach(item => {
                    container.innerHTML += `
                        <div class="flex justify-between items-center bg-gray-50 p-2 rounded">
                            <div>
                                <p class="font-semibold text-sm">${item.nama}</p>
                                <p class="text-xs text-gray-500">Rp ${item.harga.toLocaleString()} x ${item.qty}</p>
                            </div>
                            <span class="font-bold text-sm">Rp ${(item.harga * item.qty).toLocaleString()}</span>
                        </div>
                    `;
                });
            }
            hitungTotal();
        }

        function hitungTotal() {
            const total = keranjang.reduce((sum, item) => sum + (item.harga * item.qty), 0);
            document.getElementById('total-harga').innerText = `Rp ${total.toLocaleString()}`;
            hitungKembalian();
        }

        function hitungKembalian() {
            const total = keranjang.reduce((sum, item) => sum + (item.harga * item.qty), 0);
            const bayar = parseInt(document.getElementById('bayar').value) || 0;
            const kembalian = bayar - total;
            document.getElementById('kembalian').innerText = `Rp ${kembalian > 0 ? kembalian.toLocaleString() : 0}`;
        }

        // Proses Pemotongan Stok
        function prosesTransaksi() {
            if (keranjang.length === 0) return alert('Keranjang masih kosong!');
            const total = keranjang.reduce((sum, item) => sum + (item.harga * item.qty), 0);
            const bayar = parseInt(document.getElementById('bayar').value) || 0;

            if (bayar < total) return alert('Uang pembayaran kurang!');

            // Potong Stok
            keranjang.forEach(item => {
                const produk = produkList.find(p => p.id === item.id);
                if (produk) {
                    produk.stok -= item.qty;
                }
            });

            simpanData();
            alert('Transaksi Berhasil! Stok telah dipotong secara otomatis.');
            
            // Siapkan Tampilan Struk
            siapkanStruk(total, bayar, bayar - total);
        }

        function siapkanStruk(total, bayar, kembalian) {
            document.getElementById('faktur-tanggal').innerText = new Date().toLocaleString('id-ID');
            const itemContainer = document.getElementById('faktur-item');
            itemContainer.innerHTML = '';
            
            keranjang.forEach(item => {
                itemContainer.innerHTML += `
                    <div class="flex justify-between">
                        <span>${item.nama} (${item.qty}x)</span>
                        <span>Rp ${(item.harga * item.qty).toLocaleString()}</span>
                    </div>
                `;
            });

            document.getElementById('faktur-total').innerText = `Rp ${total.toLocaleString()}`;
            document.getElementById('faktur-bayar').innerText = `Rp ${bayar.toLocaleString()}`;
            document.getElementById('faktur-kembalian').innerText = `Rp ${kembalian.toLocaleString()}`;
            
            keranjang = [];
            document.getElementById('bayar').value = '';
            renderKeranjang();
        }

        function cetakFaktur() {
            const areaCetak = document.getElementById('area-cetak');
            if (areaCetak.innerHTML.includes('Rp 0') || document.getElementById('faktur-total').innerText === "") {
                return alert('Selesaikan transaksi terlebih dahulu sebelum mencetak!');
            }
            areaCetak.classList.remove('hidden');
            window.print();
            areaCetak.classList.add('hidden');
        }

        // Init
        renderProduk();
    </script>
</body>
</html>
