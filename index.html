<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>POS ARYA GROSIR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg-dark: #0a0a0a;
      --card-bg: #141414;
      --card-border: #262626;
      --accent-gold: #e5a93b;
      --accent-green: #22c55e;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      padding-bottom: 30px;
    }

    .header-box {
      text-align: center;
      padding: 15px 10px;
      border-bottom: 1px solid var(--card-border);
      position: relative;
    }

    .logo-img {
      max-height: 80px;
      object-fit: contain;
    }

    .btn-home {
      position: absolute;
      right: 15px;
      top: 20px;
      background: rgba(229, 169, 59, 0.15);
      color: var(--accent-gold);
      border: 1px solid var(--accent-gold);
      border-radius: 8px;
      padding: 6px 16px;
      font-weight: 600;
    }

    .grid-menu {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      padding: 15px;
      max-width: 800px;
      margin: 0 auto;
    }

    .menu-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      min-height: 120px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .menu-card:active {
      transform: scale(0.97);
      background: #1f1f1f;
    }

    .menu-icon {
      font-size: 28px;
      padding: 10px;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .menu-title {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .container-view {
      max-width: 800px;
      margin: 0 auto;
      padding: 15px;
    }

    .card-custom {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .form-control, .form-select {
      background-color: #1f1f1f;
      border: 1px solid var(--card-border);
      color: #fff;
    }

    .form-control:focus, .form-select:focus {
      background-color: #262626;
      color: #fff;
      border-color: var(--accent-gold);
      box-shadow: none;
    }

    .uppercase-input { text-transform: uppercase; }

    #scanner-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.95);
      z-index: 9999;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    #interactive {
      width: 100%;
      max-width: 500px;
      height: 300px;
    }

    .watermark-lunas {
      position: absolute;
      top: 40%;
      left: 20%;
      transform: rotate(-30deg);
      font-size: 60px;
      font-weight: 900;
      color: rgba(34, 197, 94, 0.3);
      border: 8px solid rgba(34, 197, 94, 0.3);
      padding: 10px 20px;
      border-radius: 10px;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header-box">
    <img src="logo web arya.png" alt="ARYA GROSIR" class="logo-img" onerror="this.src='https://via.placeholder.com/150x60?text=ARYA+GROSIR'">
    <button class="btn btn-home" onclick="navTo('MAIN_MENU')"><i class="bi bi-house-door-fill"></i> HOME</button>
  </div>

  <!-- VIEW: MENU UTAMA -->
  <div id="view-main-menu" class="view-panel">
    <div class="grid-menu">
      <div class="menu-card" onclick="openSubMenu('STOK')">
        <div class="menu-icon" style="background: rgba(59, 130, 246, 0.15); color: #3b82f6;"><i class="bi bi-box-seam"></i></div>
        <div class="menu-title">Stok Barang</div>
      </div>
      <div class="menu-card" onclick="openSubMenu('BELANJA')">
        <div class="menu-icon" style="background: rgba(168, 85, 247, 0.15); color: #a855f7;"><i class="bi bi-bag-check"></i></div>
        <div class="menu-title">Belanja Barang</div>
      </div>
      <div class="menu-card" onclick="openSubMenu('PENJUALAN')">
        <div class="menu-icon" style="background: rgba(234, 179, 8, 0.15); color: #eab308;"><i class="bi bi-cart3"></i></div>
        <div class="menu-title">Penjualan</div>
      </div>
      <div class="menu-card" onclick="openSubMenu('PERKIRAAN')">
        <div class="menu-icon" style="background: rgba(236, 72, 153, 0.15); color: #ec4899;"><i class="bi bi-graph-up-arrow"></i></div>
        <div class="menu-title">Perkiraan Belanja</div>
      </div>
      <div class="menu-card" onclick="openSubMenu('PENGELUARAN')">
        <div class="menu-icon" style="background: rgba(239, 68, 68, 0.15); color: #ef4444;"><i class="bi bi-receipt"></i></div>
        <div class="menu-title">Pengeluaran Lain</div>
      </div>
      <div class="menu-card" onclick="openSubMenu('KEUNTUNGAN')">
        <div class="menu-icon" style="background: rgba(34, 197, 94, 0.15); color: #22c55e;"><i class="bi bi-wallet2"></i></div>
        <div class="menu-title">Keuntungan</div>
      </div>
      <div class="menu-card" onclick="openSubMenu('FAKTUR')">
        <div class="menu-icon" style="background: rgba(14, 165, 233, 0.15); color: #0ea5e9;"><i class="bi bi-file-earmark-text"></i></div>
        <div class="menu-title">Pengaturan Faktur</div>
      </div>
      <div class="menu-card" onclick="openSubMenu('SINKRON')">
        <div class="menu-icon" style="background: rgba(20, 184, 166, 0.15); color: #14b8a6;"><i class="bi bi-arrow-repeat"></i></div>
        <div class="menu-title">Sinkronisasi</div>
      </div>
    </div>
  </div>

  <!-- VIEW: SUBMENU GENERIC -->
  <div id="view-submenu" class="view-panel container-view" style="display:none;">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 id="submenu-title" class="fw-bold mb-0">Submenu</h4>
      <button id="btn-transaksi-baru" class="btn btn-warning text-dark fw-bold" onclick="openFormNew()">
        <i class="bi bi-plus-lg"></i> Transaksi Baru (F5)
      </button>
    </div>
    <div id="submenu-content"></div>
  </div>

  <!-- VIEW: FORM INPUT / KERANJANG -->
  <div id="view-form" class="view-panel container-view" style="display:none;">
    <div class="card-custom">
      <h5 id="form-title" class="fw-bold text-warning mb-3">Form Input</h5>
      <div id="form-body"></div>
      <div class="d-flex justify-content-end gap-2 mt-4">
        <button class="btn btn-secondary" onclick="closeForm()">Batal / Cancel</button>
        <button class="btn btn-success fw-bold" onclick="saveCurrentForm()">Simpan (F8)</button>
      </div>
    </div>
  </div>

  <!-- CAMERA SCANNER MODAL -->
  <div id="scanner-modal">
    <div id="interactive"></div>
    <div class="mt-3 text-center">
      <button class="btn btn-outline-light me-2" onclick="toggleFlash()"><i class="bi bi-lightning-fill"></i> Senter</button>
      <button class="btn btn-danger" onclick="stopScanner()">Tutup</button>
    </div>
  </div>

  <script>
    // --- STATE MANAGEMENT ---
    let appState = {
      currentView: 'MAIN_MENU',
      activeModule: '',
      historyStack: [],
      data: {
        katalog: [],
        belanja: [],
        penjualan: [],
        pengeluaran: []
      },
      cart: [],
      gasUrl: localStorage.getItem('GAS_URL') || ''
    };

    let html5QrcodeScanner = null;

    // --- NAVIGATION & HISTORY ---
    function navTo(view, pushState = true) {
      if (pushState) {
        history.pushState({ view: view, module: appState.activeModule }, '');
      }
      appState.currentView = view;
      document.querySelectorAll('.view-panel').forEach(el => el.style.display = 'none');

      if (view === 'MAIN_MENU') {
        document.getElementById('view-main-menu').style.display = 'block';
      } else if (view === 'SUBMENU') {
        document.getElementById('view-submenu').style.display = 'block';
      } else if (view === 'FORM') {
        document.getElementById('view-form').style.display = 'block';
      }
    }

    window.onpopstate = function(event) {
      if (event.state) {
        appState.activeModule = event.state.module || '';
        navTo(event.state.view, false);
      } else {
        navTo('MAIN_MENU', false);
      }
    };

    function openSubMenu(module) {
      appState.activeModule = module;
      document.getElementById('submenu-title').innerText = getModuleTitle(module);
      renderSubmenuContent(module);
      navTo('SUBMENU');
    }

    function getModuleTitle(module) {
      const titles = {
        STOK: 'Katalog Stok Barang', BELANJA: 'Riwayat Belanja',
        PENJUALAN: 'Riwayat Penjualan', PERKIRAAN: 'Perkiraan Belanja',
        PENGELUARAN: 'Pengeluaran Lain', KEUNTUNGAN: 'Dashboard Keuntungan',
        FAKTUR: 'Pengaturan Faktur', SINKRON: 'Sinkronisasi Spreadsheet'
      };
      return titles[module] || 'Menu';
    }

    // --- SHORTCUT KEYS ---
    window.addEventListener('keydown', function(e) {
      if (e.key === 'F5') {
        e.preventDefault();
        openFormNew();
      } else if (e.key === 'F8') {
        e.preventDefault();
        saveCurrentForm();
      }
    });

    // --- SUBMENU CONTENT RENDERER ---
    function renderSubmenuContent(module) {
      const container = document.getElementById('submenu-content');
      let html = '';

      if (module === 'STOK') {
        html = `<div class="list-group">` + 
          appState.data.katalog.map((item, i) => `
            <div class="list-group-item card-custom d-flex justify-content-between align-items-center" onclick="viewDetailStok(${i})">
              <div>
                <div class="fw-bold text-warning">${item['NAMA BARANG']}</div>
                <small class="text-muted">Barcode: ${item['BARCODE']} | Stok: ${item['QTY']} ${item['SATUAN']}</small>
              </div>
              <span class="badge ${item['QTY'] <= item['MINIMAL QTY'] ? 'bg-danger' : 'bg-success'}">
                Min: ${item['MINIMAL QTY']}
              </span>
            </div>
          `).join('') + `</div>`;
      } 
      else if (module === 'BELANJA' || module === 'PENJUALAN') {
        const list = module === 'BELANJA' ? appState.data.belanja : appState.data.penjualan;
        html = `<div class="list-group">` + 
          list.map((item, i) => `
            <div class="list-group-item card-custom d-flex justify-content-between align-items-center" onclick="openCartDetail('${module}', '${item.ID}')">
              <div>
                <div class="fw-bold">ID: ${item.ID} (${item.TANGGAL})</div>
                <small class="text-muted">Total: Rp ${formatNumber(item['TOTAL HARGA'] || 0)}</small>
              </div>
              <i class="bi bi-chevron-right"></i>
            </div>
          `).join('') + `</div>`;
      }
      else if (module === 'KEUNTUNGAN') {
        html = `
          <div class="row g-2 mb-3">
            <div class="col-6"><div class="card-custom text-center"><small class="text-muted">Laba Bersih Kemarin</small><h6 class="text-success fw-bold">Rp 450.000</h6></div></div>
            <div class="col-6"><div class="card-custom text-center"><small class="text-muted">Laba Bersih Bulan Ini</small><h6 class="text-success fw-bold">Rp 12.300.000</h6></div></div>
            <div class="col-6"><div class="card-custom text-center"><small class="text-muted">Pengeluaran Kemarin</small><h6 class="text-danger fw-bold">Rp 50.000</h6></div></div>
            <div class="col-6"><div class="card-custom text-center"><small class="text-muted">Pengeluaran Bulan Ini</small><h6 class="text-danger fw-bold">Rp 1.200.000</h6></div></div>
          </div>
          <div class="card-custom mb-3"><canvas id="profitChart" height="200"></canvas></div>
        `;
        setTimeout(initChart, 100);
      }
      else if (module === 'SINKRON') {
        html = `
          <div class="card-custom">
            <h6>URL Google Apps Script Web App</h6>
            <input type="text" id="gas-url-input" class="form-control mb-2" value="${appState.gasUrl}" placeholder="https://script.google.com/macros/s/.../exec">
            <button class="btn btn-primary btn-sm mb-3" onclick="saveGasUrl()">Simpan URL</button>
            <div class="d-flex gap-2">
              <button class="btn btn-success flex-fill" onclick="pushData()"><i class="bi bi-cloud-upload"></i> Kirim Data</button>
              <button class="btn btn-info text-white flex-fill" onclick="pullData()"><i class="bi bi-cloud-download"></i> Tarik Data</button>
            </div>
          </div>
        `;
      }
      else if (module === 'FAKTUR') {
        html = `
          <div class="card-custom text-center">
            <h6>Template Google Docs Faktur</h6>
            <p class="text-muted small">Klik tombol di bawah untuk membuka dan mengedit layout faktur penjualan di Google Docs.</p>
            <a href="https://docs.google.com/document/d/1_example_doc_id/edit" target="_blank" class="btn btn-warning"><i class="bi bi-pencil-square"></i> Buka Google Docs Faktur</a>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    // --- FORM ACTIONS ---
    function openFormNew() {
      const module = appState.activeModule;
      const title = document.getElementById('form-title');
      const body = document.getElementById('form-body');
      appState.cart = [];

      if (module === 'STOK') {
        title.innerText = "Tambah Barang Stok Baru";
        body.innerHTML = `
          <div class="mb-2">
            <label>Barcode</label>
            <div class="input-group">
              <input type="text" id="inp-barcode" class="form-control">
              <button class="btn btn-warning" onclick="startScanner('inp-barcode')"><i class="bi bi-camera"></i></button>
            </div>
          </div>
          <div class="mb-2"><label>Nama Barang</label><input type="text" id="inp-nama" class="form-control uppercase-input"></div>
          <div class="row g-2 mb-2">
            <div class="col-6"><label>Qty</label><input type="text" id="inp-qty" class="form-control" onkeyup="formatCurrency(this)"></div>
            <div class="col-6"><label>Satuan</label><input type="text" id="inp-satuan" class="form-control uppercase-input"></div>
          </div>
          <div class="mb-2"><label>Harga Pokok</label><input type="text" id="inp-hpokok" class="form-control" onkeyup="formatCurrency(this)"></div>
          <div class="mb-2"><label>Harga Jual Grosir</label><input type="text" id="inp-hgrosir" class="form-control" onkeyup="formatCurrency(this)"></div>
          <div class="mb-2"><label>Harga Jual Retail</label><input type="text" id="inp-hretail" class="form-control" onkeyup="formatCurrency(this)"></div>
        `;
      } 
      else if (module === 'PENJUALAN') {
        title.innerText = "Penjualan Baru";
        body.innerHTML = `
          <div class="row g-2 mb-2">
            <div class="col-6"><label>Tipe Pembeli</label><select id="inp-customer" class="form-select"><option value="retail">Retail</option><option value="grosir">Grosir</option></select></div>
            <div class="col-6"><label>Barcode</label><div class="input-group"><input type="text" id="inp-barcode" class="form-control"><button class="btn btn-warning" onclick="startScanner('inp-barcode')"><i class="bi bi-camera"></i></button></div></div>
          </div>
          <div class="mb-2"><label>Nama Barang</label><input type="text" id="inp-nama" class="form-control uppercase-input" placeholder="Ketik nama barang..."></div>
          <div class="row g-2 mb-2">
            <div class="col-6"><label>Qty</label><input type="text" id="inp-qty" class="form-control" onkeyup="formatCurrency(this)"></div>
            <div class="col-6"><label>Satuan</label><input type="text" id="inp-satuan" class="form-control" readonly></div>
          </div>
          <button class="btn btn-primary w-100 mb-3" onclick="addToCart()">+ Masukkan Ke Keranjang</button>
          <div id="cart-list"></div>
        `;
      }
      navTo('FORM');
    }

    function closeForm() {
      navTo('SUBMENU');
    }

    function saveCurrentForm() {
      alert("Data Berhasil Disimpan!");
      closeForm();
    }

    // --- CURRENCY & FORMATTING ---
    function formatCurrency(input) {
      let val = input.value.replace(/\D/g, '');
      input.value = new Intl.NumberFormat('id-ID').format(val);
    }

    function formatNumber(val) {
      return new Intl.NumberFormat('id-ID').format(val);
    }

    // --- BARCODE CAMERA SCANNER ---
    function startScanner(targetInputId) {
      document.getElementById('scanner-modal').style.display = 'flex';
      html5QrcodeScanner = new Html5Qrcode("interactive");
      html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 15, qrbox: 250 },
        (decodedText) => {
          document.getElementById(targetInputId).value = decodedText;
          stopScanner();
        }
      );
    }

    function stopScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          document.getElementById('scanner-modal').style.display = 'none';
        });
      } else {
        document.getElementById('scanner-modal').style.display = 'none';
      }
    }

    // --- CHART GRAPH ---
    function initChart() {
      const ctx = document.getElementById('profitChart');
      if (!ctx) return;
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul'],
          datasets: [{
            label: 'Laba Bersih',
            data: [5000000, 7000000, 4000000, 12000000, 9000000, 15000000, 11000000],
            backgroundColor: ['#ef4444', '#eab308', '#ef4444', '#22c55e', '#eab308', '#22c55e', '#22c55e']
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } }
        }
      });
    }

    // --- SINKRONISASI backend ---
    function saveGasUrl() {
      const url = document.getElementById('gas-url-input').value;
      localStorage.setItem('GAS_URL', url);
      appState.gasUrl = url;
      alert("URL GAS Berhasil Disimpan!");
    }

    function pushData() {
      if (!appState.gasUrl) return alert("Masukkan URL Google Apps Script terlebih dahulu!");
      fetch(appState.gasUrl, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'SYNC_PUSH', data: appState.data })
      }).then(() => alert("Kirim Data Berhasil!"));
    }

    function pullData() {
      if (!appState.gasUrl) return alert("Masukkan URL Google Apps Script terlebih dahulu!");
      fetch(appState.gasUrl + '?action=SYNC_PULL')
        .then(res => res.json())
        .then(res => {
          if (res.data) {
            appState.data = res.data;
            alert("Tarik Data Berhasil!");
            renderSubmenuContent(appState.activeModule);
          }
        });
    }
  </script>
</body>
</html>
