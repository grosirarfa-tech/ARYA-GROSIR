<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ARYA GROSIR - POS System</title>
  
  <!-- Tailwind CSS & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Barcode Scanner Library & Chart.js -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      background-color: #050505;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    .card-menu {
      background: #121212;
      border: 1px solid #222222;
      border-radius: 20px;
      transition: all 0.2s ease;
    }
    .card-menu:active {
      transform: scale(0.98);
      background: #1a1a1a;
      border-color: #f59e0b;
    }
    .input-dark {
      background: #0a0a0a;
      border: 1px solid #2a2a2a;
      color: #ffffff;
      border-radius: 10px;
      padding: 10px 14px;
      width: 100%;
      outline: none;
    }
    .input-dark:focus {
      border-color: #f59e0b;
    }
    .label-field {
      font-size: 0.75rem;
      color: #9ca3af;
      margin-bottom: 0.25rem;
      display: block;
      font-weight: 600;
    }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 sm:p-5">

  <!-- HEADER UTAMA -->
  <header class="flex flex-col items-center justify-center pt-2 pb-4">
    <img src="logo web arya.png" alt="Arya Grosir Logo" class="h-16 sm:h-20 object-contain mb-2 cursor-pointer" onclick="goHome()">
    <div class="flex items-center gap-3 text-xs sm:text-sm">
      <span class="text-emerald-500 font-bold flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> PREMIUM POS SYSTEM
      </span>
      <button onclick="goHome()" class="bg-amber-500/10 border border-amber-500/40 text-amber-400 px-3 py-1 rounded-full flex items-center gap-1 font-semibold hover:bg-amber-500/20">
        <i class="fa-solid fa-house text-xs"></i> HOME
      </button>
      <span id="liveClock" class="text-gray-400 font-mono">00:00:00</span>
    </div>
  </header>

  <!-- CONTAINER DINAMIS -->
  <main id="app" class="flex-1 max-w-3xl w-full mx-auto pb-6">
    <!-- UI RENDERED HERE -->
  </main>

  <!-- MODAL FULLSCREEN SCANNER BARCODE -->
  <div id="scannerModal" class="fixed inset-0 bg-black z-50 hidden flex-col justify-between p-4">
    <div class="flex justify-between items-center z-10">
      <span class="text-white font-bold text-sm">Scan Barcode Barang</span>
      <button onclick="closeScanner()" class="bg-red-600 px-4 py-1.5 rounded-full text-xs font-bold">Tutup</button>
    </div>
    <div id="reader" class="w-full max-w-md mx-auto my-auto rounded-lg overflow-hidden border border-amber-500"></div>
    <div class="text-center pb-4">
      <button id="torchBtn" onclick="toggleTorch()" class="bg-gray-800 text-amber-400 border border-amber-500/30 px-6 py-2 rounded-full text-xs font-bold">
        <i class="fa-solid fa-flashlight"></i> Toggle Senter
      </button>
    </div>
  </div>

  <script>
    // LOCAL STORAGE STATE
    let db = {
      katalog: JSON.parse(localStorage.getItem('ag_katalog')) || [],
      belanja: JSON.parse(localStorage.getItem('ag_belanja')) || [],
      penjualan: JSON.parse(localStorage.getItem('ag_penjualan')) || [],
      pengeluaran: JSON.parse(localStorage.getItem('ag_pengeluaran')) || [],
      gasUrl: localStorage.getItem('ag_gas_url') || ''
    };

    let cartTemp = [];
    let activeTransactionId = null;
    let activeTransactionDate = null;
    let currentRoute = { view: 'MAIN', param: null };
    let html5QrCode = null;
    let torchState = false;
    let scanTargetCallback = null;

    function saveState() {
      localStorage.setItem('ag_katalog', JSON.stringify(db.katalog));
      localStorage.setItem('ag_belanja', JSON.stringify(db.belanja));
      localStorage.setItem('ag_penjualan', JSON.stringify(db.penjualan));
      localStorage.setItem('ag_pengeluaran', JSON.stringify(db.pengeluaran));
      localStorage.setItem('ag_gas_url', db.gasUrl);
    }

    setInterval(() => {
      const now = new Date();
      const clockEl = document.getElementById('liveClock');
      if (clockEl) clockEl.innerText = now.toTimeString().split(' ')[0];
    }, 1000);

    function formatNumber(num) {
      if (!num && num !== 0) return '';
      return num.toString().replace(/\D/g, "").replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    function parseNumber(str) {
      if (!str) return 0;
      return parseInt(str.toString().replace(/\./g, '')) || 0;
    }

    function formatRp(val) {
      return "Rp " + formatNumber(val || 0);
    }

    function navigateTo(view, param = null) {
      window.history.pushState({ view: view, param: param }, '', '');
      renderView(view, param);
    }

    function goHome() {
      navigateTo('MAIN');
    }

    window.addEventListener('popstate', function (event) {
      if (event.state && event.state.view) {
        renderView(event.state.view, event.state.param);
      } else {
        if (confirm("Keluar dari Aplikasi ARYA GROSIR?")) {
          window.close();
        } else {
          window.history.pushState({ view: 'MAIN' }, '', '');
          renderView('MAIN');
        }
      }
    });

    window.addEventListener('keydown', function(e) {
      if (e.key === 'F5') {
        e.preventDefault();
        if (currentRoute.view === 'STOK_LIST') navigateTo('STOK_FORM');
        if (currentRoute.view === 'BELANJA_LIST') startNewBelanja();
        if (currentRoute.view === 'PENJUALAN_LIST') startNewPenjualan();
      }
      if (e.key === 'F7') {
        e.preventDefault();
        window.history.back();
      }
      if (e.key === 'F8') {
        e.preventDefault();
        if (currentRoute.view === 'BELANJA_FORM') checkoutBelanja();
        if (currentRoute.view === 'PENJUALAN_FORM') checkoutPenjualan();
        if (currentRoute.view === 'STOK_FORM') saveKatalogForm(currentRoute.param);
      }
    });

    function startNewBelanja() {
      cartTemp = [];
      activeTransactionId = 'BLJ-' + Date.now().toString().slice(-6);
      activeTransactionDate = new Date().toISOString().split('T')[0];
      navigateTo('BELANJA_FORM');
    }

    function startNewPenjualan() {
      cartTemp = [];
      activeTransactionId = 'PJL-' + Date.now().toString().slice(-6);
      activeTransactionDate = new Date().toISOString().split('T')[0];
      navigateTo('PENJUALAN_FORM');
    }

    function renderView(view, param) {
      currentRoute = { view: view, param: param };
      const app = document.getElementById('app');
      app.innerHTML = '';

      if (view === 'MAIN') {
        app.innerHTML = `
          <div class="grid grid-cols-2 gap-3 sm:gap-4 mt-2">
            <div onclick="navigateTo('BELANJA_LIST')" class="card-menu p-5 flex flex-col items-center justify-center text-center cursor-pointer min-h-[120px]">
              <i class="fa-solid fa-basket-shopping text-3xl text-amber-500 mb-2"></i>
              <span class="font-bold text-xs sm:text-sm tracking-wide">BELANJA BARANG</span>
            </div>
            <div onclick="navigateTo('PENJUALAN_LIST')" class="card-menu p-5 flex flex-col items-center justify-center text-center cursor-pointer min-h-[120px]">
              <i class="fa-solid fa-cart-shopping text-3xl text-amber-500 mb-2"></i>
              <span class="font-bold text-xs sm:text-sm tracking-wide">PENJUALAN</span>
            </div>
            <div onclick="navigateTo('STOK_LIST')" class="card-menu p-5 flex flex-col items-center justify-center text-center cursor-pointer min-h-[120px]">
              <i class="fa-solid fa-boxes-stacked text-3xl text-cyan-500 mb-2"></i>
              <span class="font-bold text-xs sm:text-sm tracking-wide">STOK BARANG</span>
            </div>
            <div onclick="navigateTo('PERKIRAAN')" class="card-menu p-5 flex flex-col items-center justify-center text-center cursor-pointer min-h-[120px]">
              <i class="fa-solid fa-chart-line text-3xl text-purple-500 mb-2"></i>
              <span class="font-bold text-xs sm:text-sm tracking-wide">PERKIRAAN BELANJA</span>
            </div>
            <div onclick="navigateTo('PENGELUARAN')" class="card-menu p-5 flex flex-col items-center justify-center text-center cursor-pointer min-h-[120px]">
              <i class="fa-solid fa-receipt text-3xl text-teal-500 mb-2"></i>
              <span class="font-bold text-xs sm:text-sm tracking-wide">PENGELUARAN LAIN</span>
            </div>
            <div onclick="navigateTo('KEUNTUNGAN')" class="card-menu p-5 flex flex-col items-center justify-center text-center cursor-pointer min-h-[120px]">
              <i class="fa-solid fa-wallet text-3xl text-pink-500 mb-2"></i>
              <span class="font-bold text-xs sm:text-sm tracking-wide">KEUNTUNGAN</span>
            </div>
            <div onclick="window.open('https://docs.google.com', '_blank')" class="card-menu p-5 flex flex-col items-center justify-center text-center cursor-pointer min-h-[120px]">
              <i class="fa-solid fa-file-invoice text-3xl text-yellow-500 mb-2"></i>
              <span class="font-bold text-xs sm:text-sm tracking-wide">PENGATURAN FAKTUR</span>
            </div>
            <div onclick="navigateTo('SYNC')" class="card-menu p-5 flex flex-col items-center justify-center text-center cursor-pointer min-h-[120px]">
              <i class="fa-solid fa-rotate text-3xl text-emerald-500 mb-2"></i>
              <span class="font-bold text-xs sm:text-sm tracking-wide">SINKRONISASI</span>
            </div>
          </div>
        `;
      }

      // a. KATALOG STOK BARANG (1 Barang 1 List)
      else if (view === 'STOK_LIST') {
        app.innerHTML = `
          <div class="flex justify-between items-center mb-4">
            <h2 class="font-bold text-base">Katalog Stok Barang</h2>
            <button onclick="navigateTo('STOK_FORM')" class="bg-amber-600 px-3 py-1.5 rounded-xl text-xs font-bold">+ Tambah Barang (F5)</button>
          </div>
          <div class="space-y-2">
            ${db.katalog.length === 0 ? '<p class="text-gray-500 text-xs text-center py-6">Belum ada barang di katalog.</p>' : ''}
            ${db.katalog.map((item, idx) => `
              <div onclick="navigateTo('STOK_DETAIL', ${idx})" class="card-menu p-3 cursor-pointer hover:border-amber-500">
                <div class="flex justify-between items-center">
                  <span class="font-bold text-amber-400 text-sm">${item['NAMA BARANG']}</span>
                  <span class="bg-gray-800 text-white text-[10px] px-2 py-0.5 rounded-full">Stok: ${formatNumber(item['QTY'])} ${item['SATUAN'] || ''}</span>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }
      else if (view === 'STOK_DETAIL') {
        let item = db.katalog[param];
        app.innerHTML = `
          <div class="card-menu p-4 space-y-3">
            <h3 class="font-bold text-amber-400 border-b border-gray-800 pb-2">Detail Barang</h3>
            <div class="grid grid-cols-2 gap-2 text-xs">
              <span class="text-gray-400">Barcode:</span> <span class="font-bold">${item['BARCODE'] || '-'}</span>
              <span class="text-gray-400">Nama Barang:</span> <span class="font-bold">${item['NAMA BARANG']}</span>
              <span class="text-gray-400">Qty Stok:</span> <span class="font-bold">${formatNumber(item['QTY'])} ${item['SATUAN']}</span>
              <span class="text-gray-400">Minimal Stok:</span> <span class="font-bold">${formatNumber(item['MINIMAL QTY'])}</span>
              <span class="text-gray-400">Harga Pokok:</span> <span class="font-bold">${formatRp(item['HARGA POKOK'])}</span>
              <span class="text-gray-400">Harga Grosir:</span> <span class="font-bold">${formatRp(item['HARGA JUAL GROSIR'])}</span>
              <span class="text-gray-400">Harga Retail:</span> <span class="font-bold">${formatRp(item['HARGA JUAL RETAIL'])}</span>
            </div>
            <div class="flex gap-2 pt-3">
              <button onclick="navigateTo('STOK_FORM', ${param})" class="flex-1 bg-amber-600 py-2 rounded-xl text-xs font-bold">Edit Barang</button>
              <button onclick="deleteKatalog(${param})" class="flex-1 bg-red-600 py-2 rounded-xl text-xs font-bold">Hapus</button>
            </div>
          </div>
        `;
      }
      // b. FORM TAMBAH BARANG BARU
      else if (view === 'STOK_FORM') {
        let item = param !== null ? db.katalog[param] : {};
        app.innerHTML = `
          <div class="card-menu p-4 space-y-3">
            <h3 class="font-bold border-b border-gray-800 pb-2">${param !== null ? 'Edit Barang' : 'Tambah Barang Baru'}</h3>
            
            <div>
              <label class="label-field">Barcode Scanner</label>
              <div class="flex gap-2">
                <input type="text" id="kBarcode" value="${item['BARCODE'] || ''}" class="input-dark text-xs">
                <button onclick="openScanner((code)=>{ document.getElementById('kBarcode').value=code; })" class="bg-amber-600 px-3 rounded-lg text-xs font-bold"><i class="fa-solid fa-camera"></i></button>
              </div>
            </div>

            <div>
              <label class="label-field">Nama Barang</label>
              <input type="text" id="kNama" value="${item['NAMA BARANG'] || ''}" class="input-dark text-xs uppercase" onkeydown="handleNextInput(event, 'kQty')">
            </div>

            <div>
              <label class="label-field">Qty</label>
              <input type="text" id="kQty" value="${formatNumber(item['QTY'])}" class="input-dark text-xs" inputmode="numeric" oninput="formatInputNumber(this)" onkeydown="handleNextInput(event, 'kSatuan')">
            </div>

            <div>
              <label class="label-field">Satuan (PCS/PACK/KG)</label>
              <input type="text" id="kSatuan" value="${item['SATUAN'] || ''}" class="input-dark text-xs uppercase" onkeydown="handleNextInput(event, 'kMinQty')">
            </div>

            <div>
              <label class="label-field">Minimal Stok</label>
              <input type="text" id="kMinQty" value="${formatNumber(item['MINIMAL QTY'])}" class="input-dark text-xs" inputmode="numeric" oninput="formatInputNumber(this)" onkeydown="handleNextInput(event, 'kHargaPokok')">
            </div>

            <div>
              <label class="label-field">Harga Pokok</label>
              <input type="text" id="kHargaPokok" value="${formatNumber(item['HARGA POKOK'])}" class="input-dark text-xs" inputmode="numeric" oninput="formatInputNumber(this)" onkeydown="handleNextInput(event, 'kHargaGrosir')">
            </div>

            <div>
              <label class="label-field">Harga Jual Grosir</label>
              <input type="text" id="kHargaGrosir" value="${formatNumber(item['HARGA JUAL GROSIR'])}" class="input-dark text-xs" inputmode="numeric" oninput="formatInputNumber(this)" onkeydown="handleNextInput(event, 'kHargaRetail')">
            </div>

            <div>
              <label class="label-field">Harga Jual Retail</label>
              <input type="text" id="kHargaRetail" value="${formatNumber(item['HARGA JUAL RETAIL'])}" class="input-dark text-xs" inputmode="numeric" oninput="formatInputNumber(this)">
            </div>

            <div class="flex gap-2 pt-2">
              <button onclick="saveKatalogForm(${param})" class="flex-1 bg-amber-600 py-2.5 rounded-xl text-xs font-bold">Simpan (F8)</button>
              <button onclick="window.history.back()" class="flex-1 bg-gray-800 py-2.5 rounded-xl text-xs font-bold">Batal/Cancel</button>
            </div>
          </div>
        `;
      }

      // c. LIST RIWAYAT BELANJA BARANG (Sorted Terbaru)
      else if (view === 'BELANJA_LIST') {
        let sortedBelanja = [...db.belanja].sort((a, b) => new Date(b.TANGGAL) - new Date(a.TANGGAL));
        app.innerHTML = `
          <div class="flex justify-between items-center mb-4">
            <h2 class="font-bold text-base">Riwayat Belanja Barang</h2>
            <button onclick="startNewBelanja()" class="bg-amber-600 px-3 py-1.5 rounded-xl text-xs font-bold">+ Transaksi Baru (F5)</button>
          </div>
          <div class="space-y-2">
            ${sortedBelanja.length === 0 ? '<p class="text-gray-500 text-xs text-center py-6">Belum ada riwayat belanja.</p>' : ''}
            ${sortedBelanja.map((b) => `
              <div onclick="navigateTo('BELANJA_DETAIL', '${b.ID}')" class="card-menu p-3 cursor-pointer hover:border-amber-500">
                <div class="flex justify-between items-center text-xs">
                  <span class="text-gray-300 font-mono w-28">${b.TANGGAL}</span>
                  <span class="text-amber-400 font-bold flex-1 text-center">${b.ID}</span>
                  <span class="text-emerald-400 font-bold w-28 text-right">${formatRp(b.TOTAL_HARGA || b['TOTAL HARGA'])}</span>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }
      else if (view === 'BELANJA_DETAIL') {
        let b = db.belanja.find(item => item.ID === param);
        if(!b) return navigateTo('BELANJA_LIST');
        app.innerHTML = `
          <div class="card-menu p-4 space-y-3">
            <div class="flex justify-between items-center border-b border-gray-800 pb-2">
              <h3 class="font-bold text-xs text-amber-400">Keranjang Belanja - ${b.ID} (${b.TANGGAL})</h3>
              <button onclick="addMoreItemsToBelanja('${b.ID}')" class="bg-blue-600 px-2.5 py-1 rounded-lg text-[10px] font-bold">+ Tambah Barang</button>
            </div>
            <div class="space-y-2 max-h-60 overflow-y-auto">
              ${(b.ITEMS || []).map((item, idx) => `
                <div class="flex justify-between items-center text-xs bg-black/40 p-2.5 rounded-lg border border-gray-800">
                  <div>
                    <div class="font-bold text-white">${item.nama}</div>
                    <div class="text-gray-400">Qty: ${formatNumber(item.qty)} ${item.satuan}</div>
                  </div>
                  <div class="flex items-center gap-3">
                    <span class="font-bold text-amber-400">${formatRp(item.total)}</span>
                    <button onclick="deleteBelanjaItem('${b.ID}', ${idx})" class="text-red-500 hover:text-red-400"><i class="fa-solid fa-trash"></i></button>
                  </div>
                </div>
              `).join('')}
            </div>
            <div class="border-t border-gray-800 pt-2 flex justify-between text-xs font-bold">
              <span>Total Belanja:</span>
              <span class="text-emerald-400">${formatRp(b.TOTAL_HARGA || b['TOTAL HARGA'])}</span>
            </div>
            <button onclick="navigateTo('BELANJA_LIST')" class="w-full bg-gray-800 py-2 rounded-xl text-xs font-bold">Kembali</button>
          </div>
        `;
      }

      // d. FORM INPUT BELANJA BARU
      else if (view === 'BELANJA_FORM') {
        app.innerHTML = `
          <div class="space-y-3">
            <div class="card-menu p-4 space-y-2">
              <h3 class="font-bold text-xs text-amber-400 border-b border-gray-800 pb-2">Input Form Belanja Baru</h3>
              
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="label-field">ID Transaksi</label>
                  <input type="text" id="bId" value="${activeTransactionId}" readonly class="input-dark text-xs bg-gray-900 text-amber-400 font-bold">
                </div>
                <div>
                  <label class="label-field">Tanggal</label>
                  <input type="date" id="bTanggal" value="${activeTransactionDate}" class="input-dark text-xs" onchange="activeTransactionDate=this.value">
                </div>
              </div>

              <div>
                <label class="label-field">Barcode Scanner</label>
                <div class="flex gap-2">
                  <input type="text" id="bBarcode" class="input-dark text-xs">
                  <button onclick="openScanner(onScanBelanja)" class="bg-amber-600 px-3 rounded-lg text-xs font-bold"><i class="fa-solid fa-camera"></i></button>
                </div>
              </div>

              <div class="relative">
                <label class="label-field">Nama Barang</label>
                <input type="text" id="bNama" class="input-dark text-xs uppercase" oninput="autoCompleteBelanja(this.value)">
                <div id="bSuggest" class="absolute left-0 right-0 bg-gray-900 border border-gray-700 rounded-b-lg hidden max-h-40 overflow-y-auto z-20"></div>
              </div>

              <div>
                <label class="label-field">Qty (Jumlah)</label>
                <input type="text" id="bQty" class="input-dark text-xs" inputmode="numeric" oninput="formatInputNumber(this); calcBelanjaTotalAuto()" onkeydown="handleQtyBelanjaKeyDown(event)">
              </div>

              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="label-field">Satuan (Otomatis)</label>
                  <input type="text" id="bSatuan" readonly class="input-dark text-xs bg-gray-900 text-gray-400 uppercase">
                </div>
                <div>
                  <label class="label-field">Total Harga (Otomatis)</label>
                  <input type="text" id="bTotal" readonly class="input-dark text-xs bg-gray-900 text-amber-400 font-bold">
                </div>
              </div>

              <button id="btnAddToCartBelanja" onclick="addToCartBelanja()" onkeydown="handleBtnBelanjaKeyDown(event)" class="w-full bg-blue-600 py-2.5 rounded-xl text-xs font-bold mt-2 focus:ring-2 focus:ring-amber-400">+ Masukkan ke Keranjang</button>
            </div>

            <div class="card-menu p-4 space-y-3">
              <h3 class="font-bold text-xs text-gray-400">List Keranjang Belanja</h3>
              <div class="space-y-2 max-h-48 overflow-y-auto">
                ${cartTemp.length === 0 ? '<p class="text-xs text-gray-500 text-center py-2">Keranjang kosong</p>' : ''}
                ${cartTemp.map((item, i) => `
                  <div class="flex justify-between items-center text-xs bg-black/40 p-2 rounded-lg border border-gray-800">
                    <div>
                      <div class="font-bold">${item.nama}</div>
                      <div class="text-gray-400">Qty: ${formatNumber(item.qty)} ${item.satuan}</div>
                    </div>
                    <div class="flex items-center gap-2">
                      <span class="font-bold text-amber-400">${formatRp(item.total)}</span>
                      <button onclick="cartTemp.splice(${i},1); renderView('BELANJA_FORM')" class="text-red-500"><i class="fa-solid fa-trash"></i></button>
                    </div>
                  </div>
                `).join('')}
              </div>
              <div class="border-t border-gray-800 pt-2 flex justify-between text-xs font-bold">
                <span>Total Items: ${cartTemp.reduce((a,b)=>a+b.qty,0)}</span>
                <span class="text-amber-400">Total: ${formatRp(cartTemp.reduce((a,b)=>a+b.total,0))}</span>
              </div>
              <div class="flex gap-2 pt-2">
                <button onclick="checkoutBelanja()" class="flex-1 bg-amber-600 py-2.5 rounded-xl text-xs font-bold">Simpan & Tambah Stok (F8)</button>
                <button onclick="window.history.back()" class="flex-1 bg-gray-800 py-2.5 rounded-xl text-xs font-bold">Batal/Cancel</button>

    // FORM INPUT HELPER & AUTO NEXT
    function formatInputNumber(el) {
      let val = parseNumber(el.value);
      el.value = formatNumber(val);
    }

    function handleNextInput(e, nextId) {
      if (e.key === 'Enter') {
        e.preventDefault();
        let nextEl = document.getElementById(nextId);
        if (nextEl) nextEl.focus();
      }
    }

    // KATALOG FORM SAVE & DELETE
    function saveKatalogForm(editIndex = null) {
      let barcode = document.getElementById('kBarcode').value;
      let nama = document.getElementById('kNama').value.toUpperCase();
      let qty = parseNumber(document.getElementById('kQty').value);
      let satuan = document.getElementById('kSatuan').value.toUpperCase();
      let minQty = parseNumber(document.getElementById('kMinQty').value);
      let hp = parseNumber(document.getElementById('kHargaPokok').value);
      let hg = parseNumber(document.getElementById('kHargaGrosir').value);
      let hr = parseNumber(document.getElementById('kHargaRetail').value);

      if (!nama) return alert('Nama barang wajib diisi!');

      let newItem = {
        'BARCODE': barcode,
        'NAMA BARANG': nama,
        'QTY': qty,
        'SATUAN': satuan,
        'MINIMAL QTY': minQty,
        'HARGA POKOK': hp,
        'HARGA JUAL GROSIR': hg,
        'HARGA JUAL RETAIL': hr
      };

      if (editIndex !== null && editIndex !== undefined && editIndex !== '') {
        db.katalog[editIndex] = newItem;
      } else {
        db.katalog.push(newItem);
      }

      saveState();
      navigateTo('STOK_LIST');
    }

    function deleteKatalog(index) {
      if (confirm("Yakin ingin menghapus barang ini?")) {
        db.katalog.splice(index, 1);
        saveState();
        navigateTo('STOK_LIST');
      }
    }

    // LOGIKA FORM BELANJA
    function autoCompleteBelanja(val) {
      const suggestBox = document.getElementById('bSuggest');
      if (!val) { suggestBox.classList.add('hidden'); return; }
      const matches = db.katalog.filter(i => i['NAMA BARANG'].toLowerCase().includes(val.toLowerCase()));
      if (matches.length === 0) { suggestBox.classList.add('hidden'); return; }

      suggestBox.innerHTML = matches.map(m => `
        <div class="p-2 border-b border-gray-800 cursor-pointer text-xs hover:bg-amber-600/20" onclick="selectSuggestBelanja('${m['NAMA BARANG']}', '${m['SATUAN']}')">
          ${m['NAMA BARANG']} (${m['SATUAN']})
        </div>
      `).join('');
      suggestBox.classList.remove('hidden');
    }

    function selectSuggestBelanja(nama, satuan) {
      document.getElementById('bNama').value = nama;
      document.getElementById('bSatuan').value = satuan;
      document.getElementById('bSuggest').classList.add('hidden');
      document.getElementById('bQty').focus();
      calcBelanjaTotalAuto();
    }

    function onScanBelanja(code) {
      document.getElementById('bBarcode').value = code;
      let match = db.katalog.find(i => i['BARCODE'] === code);
      if (match) {
        document.getElementById('bNama').value = match['NAMA BARANG'];
        document.getElementById('bSatuan').value = match['SATUAN'];
        calcBelanjaTotalAuto();
      }
    }

    function calcBelanjaTotalAuto() {
      let nama = document.getElementById('bNama').value.toUpperCase();
      let qty = parseNumber(document.getElementById('bQty').value);
      let match = db.katalog.find(i => i['NAMA BARANG'] === nama);
      if (match) {
        document.getElementById('bSatuan').value = match['SATUAN'] || '';
        if (qty > 0) {
          let total = (match['HARGA POKOK'] || 0) * qty;
          document.getElementById('bTotal').value = formatRp(total);
        } else {
          document.getElementById('bTotal').value = '';
        }
      }
    }

    function handleQtyBelanjaKeyDown(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('btnAddToCartBelanja').focus();
      }
    }

    function handleBtnBelanjaKeyDown(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        addToCartBelanja();
      }
    }

    function addToCartBelanja() {
      let nama = document.getElementById('bNama').value.toUpperCase();
      let qty = parseNumber(document.getElementById('bQty').value);
      let satuan = document.getElementById('bSatuan').value.toUpperCase();
      let total = parseNumber(document.getElementById('bTotal').value);

      if (!nama || qty <= 0) return alert('Lengkapi data barang dan Qty!');

      cartTemp.push({ nama, qty, satuan, total });
      renderView('BELANJA_FORM');
    }

    function checkoutBelanja() {
      if (cartTemp.length === 0) return alert('Keranjang belanja masih kosong!');

      let id = activeTransactionId;
      let dateStr = activeTransactionDate;
      let totalHarga = cartTemp.reduce((a, b) => a + b.total, 0);

      db.belanja.push({
        ID: id,
        TANGGAL: dateStr,
        TOTAL_HARGA: totalHarga,
        ITEMS: [...cartTemp]
      });

      cartTemp.forEach(item => {
        let match = db.katalog.find(k => k['NAMA BARANG'] === item.nama);
        let unitCost = item.qty > 0 ? Math.round(item.total / item.qty) : 0;
        if (match) {
          match['QTY'] = (match['QTY'] || 0) + item.qty;
          if(unitCost > 0) match['HARGA POKOK'] = unitCost;
        } else {
          db.katalog.push({
            'BARCODE': '',
            'NAMA BARANG': item.nama,
            'QTY': item.qty,
            'SATUAN': item.satuan,
            'MINIMAL QTY': 5,
            'HARGA POKOK': unitCost,
            'HARGA JUAL GROSIR': Math.round(unitCost * 1.1),
            'HARGA JUAL RETAIL': Math.round(unitCost * 1.2)
          });
        }
      });

      cartTemp = [];
      saveState();
      navigateTo('BELANJA_LIST');
    }

    function deleteBelanjaItem(id, itemIdx) {
      let b = db.belanja.find(i => i.ID === id);
      if(b && b.ITEMS) {
        b.ITEMS.splice(itemIdx, 1);
        b.TOTAL_HARGA = b.ITEMS.reduce((a, x) => a + x.total, 0);
        saveState();
        renderView('BELANJA_DETAIL', id);
      }
    }

    function addMoreItemsToBelanja(id) {
      activeTransactionId = id;
      cartTemp = [];
      navigateTo('BELANJA_FORM');
    }

      suggestBox.innerHTML = matches.map(m => `

          ${m['NAMA BARANG']} - Stok: ${m['QTY']} (${m['SATUAN']})
        </div>
      `).join('');
      suggestBox.classList.remove('hidden');

      document.getElementById('pNama').value = nama;

      document.getElementById('pSuggest').classList.add('hidden');
      document.getElementById('pQty').focus();
      calcPenjualanTotalAuto();
    }

    function onScanPenjualan(code) {
      document.getElementById('pBarcode').value = code;
      let match = db.katalog.find(i => i['BARCODE'] === code);
      if (match) {
        document.getElementById('pNama').value = match['NAMA BARANG'];
        document.getElementById('pSatuan').value = match['SATUAN'];
        calcPenjualanTotalAuto();
      }
    }

    function calcPenjualanTotalAuto() {
      let nama = document.getElementById('pNama').value.toUpperCase();
      let qty = parseNumber(document.getElementById('pQty').value);
      let type = document.getElementById('pType').value;
      let match = db.katalog.find(i => i['NAMA BARANG'] === nama);

      if (match) {
        document.getElementById('pSatuan').value = match['SATUAN'] || '';
        if (qty > 0) {
          let unitPrice = (type === 'GROSIR') ? (match['HARGA JUAL GROSIR'] || 0) : (match['HARGA JUAL RETAIL'] || 0);
          document.getElementById('pTotalItem').value = formatRp(unitPrice * qty);
        } else {
          document.getElementById('pTotalItem').value = '';
        }
      }
    }

    function handleQtyPenjualanKeyDown(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('btnAddToCartPenjualan').focus();
      }
    }

    function handleBtnPenjualanKeyDown(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        addToCartPenjualan();
      }
    }

    function addToCartPenjualan() {
      let nama = document.getElementById('pNama').value.toUpperCase();
      let qty = parseNumber(document.getElementById('pQty').value);
      let satuan = document.getElementById('pSatuan').value.toUpperCase();
      let type = document.getElementById('pType').value;
      let match = db.katalog.find(i => i['NAMA BARANG'] === nama);

      if (!match) return alert('Barang tidak ditemukan dalam katalog!');
      if (qty <= 0) return alert('Jumlah Qty tidak valid!');
      if (qty > match['QTY']) return alert('Stok barang tidak mencukupi! (Sisa: ' + match['QTY'] + ')');

      let unitPrice = (type === 'GROSIR') ? match['HARGA JUAL GROSIR'] : match['HARGA JUAL RETAIL'];
      let total = unitPrice * qty;
      let modal = match['HARGA POKOK'] * qty;

      cartTemp.push({ nama, qty, satuan, unitPrice, total, modal });
      renderView('PENJUALAN_FORM');
    }

    function calcKembalian() {
      let total = cartTemp.reduce((a, b) => a + b.total, 0);
      let dibayar = parseNumber(document.getElementById('pDibayar').value);
      let kembalian = dibayar - total;
      document.getElementById('pKembalian').value = kembalian >= 0 ? formatRp(kembalian) : 'Kurang ' + formatRp(Math.abs(kembalian));
    }

    function checkoutPenjualan() {
      if (cartTemp.length === 0) return alert('Keranjang penjualan masih kosong!');

      let totalHarga = cartTemp.reduce((a, b) => a + b.total, 0);
      let dibayar = parseNumber(document.getElementById('pDibayar').value);

      if (dibayar < totalHarga) return alert('Jumlah pembayaran masih kurang!');

      let id = activeTransactionId;
      let dateStr = activeTransactionDate;
      let type = document.getElementById('pType').value;
      let pembeli = document.getElementById('pPembeli').value || 'Umum';

      db.penjualan.push({
        ID: id,
        TANGGAL: dateStr,
        'TYPE PEMBELI': type,
        'NAMA PEMBELI': pembeli,
        TOTAL_HARGA: totalHarga,
        DIBAYAR: dibayar,
        KEMBALIAN: dibayar - totalHarga,
        ITEMS: [...cartTemp]
      });

      cartTemp.forEach(item => {
        let match = db.katalog.find(k => k['NAMA BARANG'] === item.nama);
        if (match) {
          match['QTY'] = Math.max(0, (match['QTY'] || 0) - item.qty);
        }
      });

      cartTemp = [];
      saveState();
      navigateTo('PENJUALAN_LIST');
    }

    function deletePenjualanItem(id, itemIdx) {
      let p = db.penjualan.find(i => i.ID === id);
      if(p && p.ITEMS) {
        p.ITEMS.splice(itemIdx, 1);
        p.TOTAL_HARGA = p.ITEMS.reduce((a, x) => a + x.total, 0);
        saveState();
        renderView('PENJUALAN_DETAIL', id);
      }
    }

    function addMoreItemsToPenjualan(id) {
      activeTransactionId = id;
      cartTemp = [];
      navigateTo('PENJUALAN_FORM');
    }

    // PENGELUARAN
    function savePengeluaran() {
      let tanggal = document.getElementById('eTanggal').value;
      let keterangan = document.getElementById('eKet').value;
      let jumlah = parseNumber(document.getElementById('eJumlah').value);

      if (!keterangan || jumlah <= 0) return alert('Lengkapi data pengeluaran!');

      db.pengeluaran.push({ TANGGAL: tanggal, KETERANGAN: keterangan, JUMLAH: jumlah });
      saveState();
      renderView('PENGELUARAN');
    }

    function deletePengeluaranByItem(tanggal, ket, jumlah) {
      let idx = db.pengeluaran.findIndex(e => e.TANGGAL === tanggal && e.KETERANGAN === ket && e.JUMLAH === jumlah);
      if(idx !== -1) {
        db.pengeluaran.splice(idx, 1);
        saveState();
        renderView('PENGELUARAN');
      }
    }

    // ANALITIK & LABA
    function getDailyKeuntunganReports() {
      let dates = new Set();
      db.penjualan.forEach(p => p.TANGGAL && dates.add(p.TANGGAL));
      db.pengeluaran.forEach(e => e.TANGGAL && dates.add(e.TANGGAL));

      let sortedDates = Array.from(dates).sort((a, b) => new Date(b) - new Date(a));

      return sortedDates.map(d => {
        let sales = db.penjualan.filter(p => p.TANGGAL === d);
        let labaKotor = sales.reduce((acc, p) => {
          let itemProfit = (p.ITEMS || []).reduce((a, i) => a + (i.total - (i.modal || 0)), 0);
          return acc + itemProfit;
        }, 0);
        let pengeluaran = db.pengeluaran.filter(e => e.TANGGAL === d).reduce((a, e) => a + e.JUMLAH, 0);
        return {
          tanggal: d,
          labaKotor: labaKotor,
          pengeluaran: pengeluaran,
          labaBersih: labaKotor - pengeluaran
        };
      });
    }

    function calcLabaKemarin() {
      let yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      let dateStr = yesterday.toISOString().split('T')[0];

      let sales = db.penjualan.filter(p => p.TANGGAL === dateStr);
      let grossProfit = sales.reduce((acc, p) => acc + (p.ITEMS || []).reduce((a, i) => a + (i.total - (i.modal || 0)), 0), 0);
      let expenses = db.pengeluaran.filter(e => e.TANGGAL === dateStr).reduce((a, e) => a + e.JUMLAH, 0);
      return grossProfit - expenses;
    }

    function calcLabaBulanIni() {
      let nowMonth = new Date().toISOString().slice(0, 7);
      let sales = db.penjualan.filter(p => (p.TANGGAL || '').startsWith(nowMonth));
      let grossProfit = sales.reduce((acc, p) => acc + (p.ITEMS || []).reduce((a, i) => a + (i.total - (i.modal || 0)), 0), 0);
      let expenses = db.pengeluaran.filter(e => (e.TANGGAL || '').startsWith(nowMonth)).reduce((a, e) => a + e.JUMLAH, 0);
      return grossProfit - expenses;
    }

    function renderChart() {
      const ctx = document.getElementById('profitChart');
      if (!ctx) return;

      let months = [];
      let profitData = [];
      for (let i = 5; i >= 0; i--) {
        let d = new Date();
        d.setMonth(d.getMonth() - i);
        let mStr = d.toISOString().slice(0, 7);
        months.push(mStr);

        let sales = db.penjualan.filter(p => (p.TANGGAL || '').startsWith(mStr));
        let gross = sales.reduce((acc, p) => acc + (p.ITEMS || []).reduce((a, item) => a + (item.total - (item.modal || 0)), 0), 0);
        let exp = db.pengeluaran.filter(e => (e.TANGGAL || '').startsWith(mStr)).reduce((a, e) => a + e.JUMLAH, 0);
        profitData.push(gross - exp);
      }

      new Chart(ctx, {
        type: 'line',
        data: {
          labels: months,
          datasets: [{
            label: 'Laba Bersih',
            data: profitData,
            borderColor: '#f59e0b',
            backgroundColor: 'rgba(245, 158, 11, 0.1)',
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: function(context) {
                  return 'Laba Bersih: ' + formatRp(context.raw);
                }
              }
            }
          },
          scales: {
            x: { ticks: { color: '#9ca3af' }, grid: { color: '#1f2937' } },
            y: { ticks: { color: '#9ca3af', callback: (val) => formatRp(val) }, grid: { color: '#1f2937' } }
          }
        },
        plugins: [{
          id: 'customNominalLabels',
          afterDatasetsDraw(chart) {
            const { ctx } = chart;
            chart.data.datasets.forEach((dataset, i) => {
              const meta = chart.getDatasetMeta(i);
              meta.data.forEach((datapoint, index) => {
                const val = dataset.data[index];
                ctx.fillStyle = '#10b981';
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(formatRp(val), datapoint.x, datapoint.y - 8);
              });
            });
          }
        }]
      });
    }

    // SCANNER & SYNC ENGINE
    function openScanner(callback) {
      scanTargetCallback = callback;
      document.getElementById('scannerModal').classList.remove('hidden');
      document.getElementById('scannerModal').classList.add('flex');

      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 150 } },
        (decodedText) => {
          if (scanTargetCallback) scanTargetCallback(decodedText);
          closeScanner();
        },
        (errorMessage) => {}
      ).catch(err => {
        alert("Gagal membuka kamera: " + err);
        closeScanner();
      });
    }

    function closeScanner() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          document.getElementById('scannerModal').classList.add('hidden');
          document.getElementById('scannerModal').classList.remove('flex');
        }).catch(() => {
          document.getElementById('scannerModal').classList.add('hidden');
          document.getElementById('scannerModal').classList.remove('flex');
        });
      } else {
        document.getElementById('scannerModal').classList.add('hidden');
        document.getElementById('scannerModal').classList.remove('flex');
      }
    }

    function toggleTorch() {
      if (html5QrCode) {
        torchState = !torchState;
        html5QrCode.applyVideoConstraints({
          advanced: [{ torch: torchState }]
        }).catch(e => alert("Senter tidak didukung pada perangkat ini."));
      }
    }

    function syncPush() {
      if (!db.gasUrl) return alert('Masukkan URL Google Apps Script terlebih dahulu!');
      fetch(db.gasUrl, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'push', data: db })
      }).then(() => {
        alert('Perintah Sync Push dikirim ke Apps Script.');
      }).catch(err => alert('Gagal Sync: ' + err));
    }

    function syncPull() {
      if (!db.gasUrl) return alert('Masukkan URL Google Apps Script terlebih dahulu!');
      fetch(db.gasUrl + '?action=pull')
        .then(res => res.json())
        .then(data => {
          if (data) {
            db.katalog = data.katalog || db.katalog;
            db.belanja = data.belanja || db.belanja;
            db.penjualan = data.penjualan || db.penjualan;
            db.pengeluaran = data.pengeluaran || db.pengeluaran;
            saveState();
            alert('Data berhasil ditarik dari cloud!');
            renderView('MAIN');
          }
        })
        .catch(err => alert('Gagal menarik data: ' + err));
    }

    renderView('MAIN');
  </script>
